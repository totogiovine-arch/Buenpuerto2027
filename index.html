<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buen Puerto">
<title>Buen Puerto 2027</title>

<style>
:root {
  --slate: #1e2d3d;
  --slate2: #263545;
  --gold: #C9A84C;
  --gold2: #e8c96a;
  --conf-bg: #2563a8;
  --conf-text: #ffffff;
  --pend-bg: #d97706;
  --pend-text: #ffffff;
  --libre-bg: #d1fae5;
  --libre-text: #065f46;
  --row-odd: #f8f9fb;
  --row-even: #ffffff;
  --header-h: 56px;
  --subheader-h: 54px;
  --unit-w: 130px;
  --cell-w: 108px;
  --cell-h: 44px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; overflow:hidden; font-family:'DM Sans',sans-serif; background:var(--slate); }

/* TOPBAR */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:200;
  background:var(--slate);
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom: 2px solid var(--gold);
  height: calc(var(--safe-top) + var(--header-h));
}
.topbar-left { display:flex; align-items:center; gap:10px; }
.logo { width:32px;height:32px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px; }
.app-title { font-size:17px;font-weight:600;color:#fff;line-height:1.1; }
.app-sub { font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase; }
.topbar-right { text-align:right; }
.stat-num { font-size:18px;font-weight:600;color:var(--gold);line-height:1; }
.stat-lbl { font-size:10px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em; }

/* LEGEND BAR */
.legend-bar {
  position:fixed; z-index:199;
  left:0; right:0;
  background:var(--slate2);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:16px;
  padding:7px 16px;
  top: calc(var(--safe-top) + var(--header-h));
}
.leg { display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.65); }
.leg-dot { width:10px;height:10px;border-radius:3px; }
.ldc { background:var(--conf-bg); }
.ldp { background:var(--pend-bg); }
.ldl { background:#34d399; }
.leg-counts { margin-left:auto;display:flex;gap:10px; }
.lc { font-size:11px;font-weight:600; }
.lc-c { color:#7db8f0; }
.lc-p { color:#fbbf24; }
.lc-l { color:#6ee7b7; }

/* SCROLL CONTAINER */
.scroll-wrap {
  position:fixed;
  top: calc(var(--safe-top) + var(--header-h) + 34px);
  left:0; right:0;
  bottom: calc(var(--safe-bot) + 0px);
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* GRID */
.grid { display:inline-block; min-width:100%; }

/* COLUMN HEADERS — sticky top */
.col-headers {
  display:flex;
  position:sticky; top:0; z-index:100;
  background:var(--slate);
  border-bottom:2px solid var(--gold);
}
.ch-unit {
  flex-shrink:0;
  width:var(--unit-w);
  min-width:var(--unit-w);
  position:sticky; left:0; z-index:101;
  background:var(--slate);
  padding:8px 10px;
  border-right:1px solid rgba(255,255,255,.12);
}
.ch-unit-inner { font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em; }

.ch-week {
  flex-shrink:0;
  width:var(--cell-w);
  min-width:var(--cell-w);
  padding:6px 8px;
  text-align:center;
  border-right:1px solid rgba(255,255,255,.07);
}
.ch-num { font-size:10px;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase; }
.ch-dates { font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;line-height:1.2; }

/* ROWS */
.row {
  display:flex;
  border-bottom:1px solid #e8ecf0;
  height:var(--cell-h);
}
.row:nth-child(even) { background:var(--row-even); }
.row:nth-child(odd)  { background:var(--row-odd); }

/* UNIT LABEL — sticky left */
.unit-label {
  flex-shrink:0;
  width:var(--unit-w);
  min-width:var(--unit-w);
  position:sticky; left:0; z-index:10;
  display:flex; flex-direction:column; justify-content:center;
  padding:0 10px;
  border-right:3px solid var(--gold);
  background:inherit;
}
.ul-name { font-size:11px;font-weight:600;color:var(--slate);line-height:1.2; }
.ul-code { font-size:9px;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-top:1px; }

/* CELL */
.cell {
  flex-shrink:0;
  width:var(--cell-w);
  min-width:var(--cell-w);
  padding:4px 5px;
  border-right:1px solid #e8ecf0;
  display:flex; align-items:center;
  cursor:pointer;
}
.cell-bar {
  width:100%; height:28px;
  border-radius:6px;
  display:flex; align-items:center;
  padding:0 7px;
  font-size:10px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:opacity .15s, transform .1s;
  user-select:none;
}
.cell:active .cell-bar { opacity:.8; transform:scale(.97); }
.bar-conf  { background:var(--conf-bg); color:var(--conf-text); }
.bar-pend  { background:var(--pend-bg); color:var(--pend-text); }
.bar-libre { background:var(--libre-bg); color:var(--libre-text); font-style:italic; }

/* MODAL */
.overlay {
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.overlay.open { opacity:1;pointer-events:all; }
.sheet {
  background:#fff;
  border-radius:20px 20px 0 0;
  width:100%;
  padding:16px 18px calc(var(--safe-bot) + 16px);
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,0,.4,1);
}
.overlay.open .sheet { transform:translateY(0); }
.handle { width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px; }
.sh-unit { font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px; }
.sh-tenant { font-size:20px;font-weight:600;color:var(--slate);margin-bottom:12px; }
.sh-row { display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:14px; }
.sh-row:last-of-type { border:none; }
.sh-key { color:#888; }
.sh-val { font-weight:500;color:var(--slate); }
.status-pill {
  display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
}
.sp-conf  { background:#dbeafe;color:#1d4ed8; }
.sp-pend  { background:#fef3c7;color:#92400e; }
.sp-libre { background:#d1fae5;color:#065f46; }

/* edit inputs */
.edit-group { display:flex;flex-direction:column;gap:4px;margin-bottom:12px; }
.edit-group label { font-size:11px;color:#888; }
.edit-group input, .edit-group select {
  padding:10px 12px;border:1px solid #ddd;border-radius:8px;
  font-size:14px;font-family:'DM Sans',sans-serif;color:var(--slate);
  background:#f9f9f9;-webkit-appearance:none;
}
.edit-group input:focus,.edit-group select:focus { outline:none;border-color:var(--slate); }
.btn-row { display:flex;gap:10px;margin-top:4px; }
.btn-save { flex:1;padding:13px;background:var(--slate);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer; }
.btn-cancel { flex:1;padding:13px;background:#f0f0f0;color:#555;border:none;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;cursor:pointer; }
.btn-edit { width:100%;padding:12px;background:var(--gold);color:var(--slate);border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:10px; }
</style>
</head>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">⚓</div>
    <div>
      <div class="app-title">Buen Puerto</div>
      <div class="app-sub">Temporada 2027</div>
    </div>
  </div>
  <div class="topbar-right">

</div>

<div class="legend-bar">

<!-- VIEW MODAL -->
<div class="overlay" id="viewOverlay">

    <div id="vRows"></div>
    <button class="btn-edit" onclick="openEditMode()">✏️ Editar reserva</button>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-cancel" onclick="closeOverlay('viewOverlay')">Cerrar</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sh-unit" id="eUnit"></div>
    <div style="font-size:16px;font-weight:600;color:var(--slate);margin-bottom:14px;">Editar reserva</div>

      <label>Inquilino / a</label>
      <input id="eTenant" type="text" placeholder="Nombre">
    </div>
    <div class="edit-group">
      <label>Estado</label>
      <select id="eStatus">
        <option value="conf">✅ Confirmado</option>
        <option value="pend">⏳ Pendiente</option>
        <option value="libre">🟢 Libre</option>
      </select>
    </div>
    <div class="edit-group">
      <label>Notas</label>
      <input id="eNotes" type="text" placeholder="Opcional...">
    </div>
    <div class="btn-row">
      <button class="btn-save" onclick="saveEdit()">Guardar</button>
      <button class="btn-cancel" onclick="closeOverlay('editOverlay')">Cancelar</button>
    </div>
  </div>
</div>

// ── STATE ────────────────────────────────────────────────────
let STATE = JSON.parse(localStorage.getItem('bp2027v2') || 'null');
if (!STATE) {
  STATE = {};
  UNITS_DATA.forEach(u => {
    STATE[u.cod] = u.weeks.map(w => ({ t: w.t, s: w.s, n: w.n||'' }));
  });
}
function save() { localStorage.setItem('bp2027v2', JSON.stringify(STATE)); }

// ── RENDER ───────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  let html = '';

  // Column headers
  html += '<div class="col-headers">';
  html += `<div class="ch-unit"><div class="ch-unit-inner">Unidad</div></div>`;
  WEEKS.forEach(w => {
    html += `<div class="ch-week"><div class="ch-num">${w.label}</div><div class="ch-dates">${w.dates}</div></div>`;
  });
  html += '</div>';

  // Rows
  let totConf=0, totPend=0, totLibre=0;
  UNITS_DATA.forEach((u, ui) => {
    html += '<div class="row">';
    html += `<div class="unit-label"><div class="ul-name">${u.name}</div><div class="ul-code">${u.cod}</div></div>`;
    WEEKS.forEach((w, wi) => {
      const d = STATE[u.cod][wi];
      const cls = d.s==='conf'?'bar-conf':d.s==='pend'?'bar-pend':'bar-libre';
      if(d.s==='conf') totConf++;
      else if(d.s==='pend') totPend++;
      else totLibre++;
      html += `<div class="cell" onclick="openView('${u.cod}',${wi})">`;
      html += `<div class="cell-bar ${cls}">${d.t}</div>`;
      html += '</div>';
    });
    html += '</div>';
  });

  grid.innerHTML = html;

  // Stats
  const total = totConf + totPend;
  document.getElementById('statOcu').textContent = `${total}/180`;
  document.getElementById('cntConf').textContent = `${totConf} conf.`;
  document.getElementById('cntPend').textContent = `${totPend} pend.`;
  document.getElementById('cntLibre').textContent = `${totLibre} libres`;
}

// ── MODAL VIEW ───────────────────────────────────────────────
let curCod=null, curWi=null;

function openView(cod, wi) {
  curCod=cod; curWi=wi;
  const u = UNITS_DATA.find(x=>x.cod===cod);
  const d = STATE[cod][wi];
  const w = WEEKS[wi];
  const sLabel = d.s==='conf'?'Confirmado':d.s==='pend'?'Pendiente':'Libre';
  const sCls   = d.s==='conf'?'sp-conf':d.s==='pend'?'sp-pend':'sp-libre';

  document.getElementById('vUnit').textContent = `${u.name} · ${w.label} (${w.dates})`;
  document.getElementById('vTenant').textContent = d.t;
  document.getElementById('vRows').innerHTML = `
    <div class="sh-row"><span class="sh-key">Estado</span><span class="sh-val"><span class="status-pill ${sCls}">${sLabel}</span></span></div>
    <div class="sh-row"><span class="sh-key">Unidad</span><span class="sh-val">${u.name} · ${u.cod}</span></div>
    <div class="sh-row"><span class="sh-key">Semana</span><span class="sh-val">${w.label} — ${w.dates}</span></div>
    ${d.n?`<div class="sh-row"><span class="sh-key">Notas</span><span class="sh-val" style="font-style:italic;color:#888">${d.n}</span></div>`:''}
  `;
  openOverlay('viewOverlay');
}

function openEditMode() {
  closeOverlay('viewOverlay');
  setTimeout(() => {
    const u = UNITS_DATA.find(x=>x.cod===curCod);
    const d = STATE[curCod][curWi];
    const w = WEEKS[curWi];
    document.getElementById('eUnit').textContent = `${u.name} · ${w.label}`;
    document.getElementById('eTenant').value = d.s==='libre'?'':d.t;
    document.getElementById('eStatus').value = d.s;
    document.getElementById('eNotes').value = d.n||'';
    openOverlay('editOverlay');
  }, 260);
}

function saveEdit() {
  const t = document.getElementById('eTenant').value.trim();
  const s = document.getElementById('eStatus').value;
  const n = document.getElementById('eNotes').value.trim();
  STATE[curCod][curWi] = { t: s==='libre'?'Libre':(t||'Libre'), s, n };
  save();
  closeOverlay('editOverlay');
  render();
}

// ── OVERLAY HELPERS ──────────────────────────────────────────
function openOverlay(id)  { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if(e.target===el) closeOverlay(el.id); });
});

// ── INIT ─────────────────────────────────────────────────────
render();

// Scroll horizontally to week 1 on load (past sem 0)
setTimeout(() => {
  const sw = document.getElementById('scrollWrap');
  const unitW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--unit-w'));
  const cellW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cell-w'));
  sw.scrollLeft = unitW; // show from week 0
}, 100);
</script>
