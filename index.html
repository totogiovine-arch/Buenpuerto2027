<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Buen Puerto">
<meta name="theme-color" content="#152238">
<style>
  :root{
    --navy:#1b2a4a;
    --navy-dark:#152238;
    --gold:#d4a94a;
    --confirmado:#c0392b;
    --color-violeta:#7e57c2;
    --color-amarillo:#e0ab2c;
    --color-verde:#2e9e5b;
    --color-gris:#737e91;
    --libre-alt:#eaf4fa;
    --text:#1b2a4a;
    --muted:#8a93a3;
    --border:#e2e6ec;

    /* paleta oscura, solo para el área del calendario (no para el diálogo) */
    --cal-bg:#101c34;
    --cal-bg-alt:#233457;
    --cal-finde:#2a3f6b;
    --cal-border:rgba(255,255,255,.08);
    --cal-text-muted:#94a3c2;
    --cal-dash:rgba(255,255,255,.28);
    --dia-alto:30px;
    --topbar-alto:51px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cal-bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);height:100%;overflow:hidden;overscroll-behavior:none;}
  body{display:flex;flex-direction:column;}

  .tab-btn{
    background:#a24e1c;border:none;border-radius:20px;
    padding:8px 14px;font-size:11px;font-weight:600;
    color:#fff8f0;cursor:pointer;white-space:nowrap;
  }
  .tab-btn.active{background:#eec436;color:var(--navy-dark);}

  #wrapHeaderDias, #wrapUnidades, #wrapDatos{ scrollbar-width:none; }
  #wrapHeaderDias::-webkit-scrollbar, #wrapUnidades::-webkit-scrollbar{ display:none; }

  table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;}

  #tablaHeaderDias, #tablaDatos{ min-width:max-content; }

  thead th{
    background:var(--navy);
    color:var(--gold);
    font-size:10.5px;
    font-weight:700;
    text-align:center;
    padding:10px 4px;
    height:var(--fila-header-alto,40px);
    box-sizing:border-box;
    border-right:1px solid rgba(255,255,255,.08);
    position:relative;
    z-index:0;
  }
  thead th .rango{display:block;color:#c9d2e2;font-weight:400;font-size:9.5px;margin-top:2px;}

  #bodyUnidades tr, #bodyTable tr{ height:var(--fila-alto,58px); }

  td.unit{
    background:inherit;
    padding:2px 4px 2px 8px;
    border-right:2px solid var(--gold);
    overflow:hidden;
    box-sizing:border-box;
    height:var(--fila-alto,58px);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  #bodyUnidades tr:nth-child(odd) td.unit, #bodyTable tr:nth-child(odd) td.cell{background:var(--cal-bg);}
  #bodyUnidades tr:nth-child(even) td.unit, #bodyTable tr:nth-child(even) td.cell{background:var(--cal-bg-alt);}

  .unit-name{font-size:var(--unit-font,10px);line-height:1.1;font-weight:600;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .unit-code{font-size:var(--unit-code-font,8px);line-height:1.1;color:var(--cal-text-muted);display:block;white-space:nowrap;}

  td.cell{
    padding:3px 0;
    text-align:center;
    border-right:1px solid var(--cal-border);
    box-sizing:border-box;
    position:relative;
    z-index:0;
  }
  td.cell.media-am{border-right:none;}

  /* Línea de fin de semana: mismo dibujo (mismo grosor) tanto en el encabezado como en el
     cuerpo. Se inserta como hijo de la celda ANTES que el bloque de la reserva, con z-index
     negativo — así la tapa una reserva ocupada, y se ve en los casilleros vacíos. */
  .linea-finde{
    position:absolute;
    top:0; bottom:0;
    width:2.5px;
    margin-left:-2.5px;
    background:rgba(255,255,255,.38);
    z-index:-1;
    pointer-events:none;
  }

  /* Línea del día de hoy: sólo en las vistas de mes. Va únicamente en el cuerpo de la
     grilla (no en el encabezado), así arranca justo en la base del cuadro del día sin
     romperlo. Cae en el MEDIO del día (entre la mañana y la tarde), o sea justo debajo
     del número. z-index negativo, igual que las líneas de finde: si hay una reserva la
     tapa y la línea reaparece más abajo, en vez de cruzarle por encima. */
  .linea-hoy{
    position:absolute;
    top:0; bottom:0;
    width:2px;
    margin-left:-1px;
    background:#ff3b30;
    z-index:-1;
    pointer-events:none;
  }

  .slot{
    height:var(--dia-alto);
    /* El bloque se centra SOLO dentro de la celda (width + margin auto) en vez de depender
       del padding del td. Antes dependía del padding y, cuando el código le sacaba el borde
       derecho a la celda (para que no quedara una línea fina pegada a la gruesa de semana),
       el bloque quedaba corrido: con aire a la izquierda y pegado a la línea de la derecha. */
    width:calc(100% - var(--slot-inset-x,2px) * 2);
    margin:0 auto;
    border-radius:6px;
    background:transparent;
    border:none;
    cursor:pointer;
    transition:transform .08s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:7px;line-height:1.05;font-weight:700;color:#fff;
    text-align:center;
    white-space:normal;
    word-break:break-word;
    overflow:hidden;
    padding:1px 3px;
    user-select:none;
  }
  .slot:active{transform:scale(.94);}
  .slot.confirmado{background:var(--confirmado); border:none;}
  .slot.violeta{background:var(--color-violeta); border:none;}
  .slot.amarillo{background:var(--color-amarillo); border:none; color:var(--navy);}
  .slot.verde{background:var(--color-verde); border:none;}
  .slot.gris{background:var(--color-gris); border:none;}

  footer{
    background:var(--navy-dark);
    padding:10px 16px;
    text-align:center;
    font-size:10px;
    color:#7d88a0;
  }

  dialog{
    border:none;border-radius:12px;padding:0;width:min(320px,88vw);
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop{background:rgba(21,34,56,.55);}
  .dlg-head{background:var(--navy);color:#fff;padding:14px 16px;font-size:14px;font-weight:600;}
  .dlg-head small{display:block;color:var(--gold);font-weight:400;font-size:11px;margin-top:2px;}
  .dlg-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .dlg-body input{
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;
  }
  .duracion-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .duracion-row label{font-size:12px;color:var(--muted);}
  .duracion-row input{width:60px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;text-align:center;}

  const DATOS_INICIALES_POR_VISTA = {
    temporada: DEFAULT_DATA_TEMPORADA,
    sep2026: DEFAULT_DATA_SEP2026,
    oct2026: DEFAULT_DATA_OCT2026,
    nov2026: DEFAULT_DATA_NOV2026,
    dic2026: DEFAULT_DATA_DIC2026,
    mar2027: {},   // arrancan vacíos: no hay reservas cargadas todavía
    abr2027: {}
  };

  // ---- Capa de datos en tiempo real contra Firestore (reemplaza el localStorage local) ----
  const COLECCION_FIRESTORE = "calendario";
  const cacheDatosPorVista = {};       // última copia conocida de cada pestaña
  const listenersActivos = {};         // un listener en vivo por pestaña
  const syncIndicador = document.getElementById("syncIndicador");
  let datos = {};                      // datos de la pestaña activa (alias del cache)

  // ---- Estado de conexión, por pestaña ----
  // Cada pestaña es un documento distinto en Firestore, así que puede fallar una sola
  // (por ejemplo, un mes nuevo todavía no habilitado) mientras el resto anda bien.
  // Por eso llevamos el registro por pestaña y no un único flag global.
  const vistasSinConexion = new Set();

  function hayConexion(){
    return !vistasSinConexion.has(vistaActual);
  }

  function actualizarEstadoConexion(){
    if(hayConexion()){
      syncIndicador.textContent = "🔄 Sincronizando…";
      syncIndicador.style.background = "var(--navy)";
      syncIndicador.style.display = "none";
    } else {
      // Aviso permanente mientras dure la falla: si no, el usuario podría creer que
      // cargó una reserva que en realidad no se guardó en ningún lado.
      clearTimeout(mostrarIndicadorSync._t);
      syncIndicador.textContent = "⚠️ Sin conexión — solo lectura";
      syncIndicador.style.background = "var(--confirmado)";
      syncIndicador.style.display = "block";
    }
  }

  function marcarConexion(vistaKey, ok){
    const antes = vistasSinConexion.has(vistaKey);
    if(ok) vistasSinConexion.delete(vistaKey);
    else   vistasSinConexion.add(vistaKey);
    if(antes !== vistasSinConexion.has(vistaKey) && vistaKey === vistaActual){
      actualizarEstadoConexion();
    }
  }

  function bloqueadoSinConexion(){
    if(hayConexion()) return false;
    mostrarToast("Sin conexión con la nube — no se puede cargar, editar ni borrar.");
    return true;
  }

  function mostrarIndicadorSync(){
    if(!hayConexion()) return;   // el aviso de sin conexión tiene prioridad
    syncIndicador.style.display = "block";
    clearTimeout(mostrarIndicadorSync._t);
    mostrarIndicadorSync._t = setTimeout(()=>{ syncIndicador.style.display = "none"; }, 900);
  }

  function iniciarListenerVista(vistaKey){
    if(listenersActivos[vistaKey]) return;
    const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaKey);
    listenersActivos[vistaKey] = window.__fb.onSnapshot(ref, (snap)=>{
      marcarConexion(vistaKey, true);
      let nuevosDatos;
      if(snap.exists()){
        nuevosDatos = snap.data().datos || {};
      } else {
        nuevosDatos = DATOS_INICIALES_POR_VISTA[vistaKey] || {};
        window.__fb.setDoc(ref, {datos: nuevosDatos}).catch(e=> console.error("Error sembrando datos iniciales:", e));
      }
      cacheDatosPorVista[vistaKey] = nuevosDatos;
      if(vistaKey === vistaActual){
        const esPrimeraCarga = !window.__appIniciada;
        datos = nuevosDatos;
        if(!esPrimeraCarga){
          mostrarIndicadorSync();
          renderTodo();
          ajustarAlturaCuadrada();
          chequearAvisos();
        }
      }
    }, (err)=>{
      console.error("Error escuchando cambios de " + vistaKey + ":", err);
      marcarConexion(vistaKey, false);
      // Solo molestamos con el cartel si la pestaña que falló es la que se está mirando.
      if(vistaKey === vistaActual){
        mostrarToast("No se pudo conectar con la base de datos en la nube.");
      }
    });
  }

  function esperarPrimerDato(vistaKey){
    return new Promise((resolve)=>{
      const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaKey);
      const unsub = window.__fb.onSnapshot(ref, (snap)=>{
        unsub();
        let nuevosDatos;
        if(snap.exists()){
          nuevosDatos = snap.data().datos || {};
        } else {
          nuevosDatos = DATOS_INICIALES_POR_VISTA[vistaKey] || {};
          window.__fb.setDoc(ref, {datos: nuevosDatos}).catch(e=> console.error("Error sembrando datos iniciales:", e));
        }
        resolve(nuevosDatos);
      }, (err)=>{
        console.error("Error obteniendo " + vistaKey + ":", err);
        resolve(DATOS_INICIALES_POR_VISTA[vistaKey] || {});
      });
    });
  }

  function guardarDatos(data){
    // Última barrera: sin conexión no se escribe nada, ni siquiera en el cache local.
    // Así no queda un cambio "a medias" que se ve en pantalla pero no existe en la nube.
    if(bloqueadoSinConexion()) return;
    cacheDatosPorVista[vistaActual] = data; // actualización local inmediata (optimista)
    const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaActual);
    const vistaDelGuardado = vistaActual;
    window.__fb.setDoc(ref, {datos: data}).catch(e=>{
      console.error("Error guardando en Firestore:", e);
      marcarConexion(vistaDelGuardado, false);
      mostrarToast("No se pudo guardar en la nube — revisá tu conexión a internet.");
    });
  }

  // ---- Confirmación genérica (independiente del cuadro de carga, para el botón Deshacer) ----
  function confirmarGenerico(msg, alConfirmar, labelSi, labelNo){
    const dlg2 = document.getElementById("confirmGenDlg");
    document.getElementById("confirmGenMsg").textContent = msg;
    const btnSi = document.getElementById("confirmGenSi");
    const btnNo = document.getElementById("confirmGenNo");
    btnSi.textContent = labelSi || "Sí";
    btnNo.textContent = labelNo || "No";
    dlg2.showModal();
    const onSi = ()=>{ limpiar(); alConfirmar(); };
    const onNo = ()=>{ limpiar(); };
    function limpiar(){
      dlg2.close();
      btnSi.removeEventListener("click", onSi);
      btnNo.removeEventListener("click", onNo);
    }
    btnSi.addEventListener("click", onSi);
    btnNo.addEventListener("click", onNo);
  }

  // ---- Deshacer (como Ctrl+Z de Excel) ----
  const UNDO_MAX = 20;
  const undoStack = [];
  const btnDeshacer = document.getElementById("btnDeshacer");

  function pushUndo(){
    undoStack.push(JSON.stringify(datos));
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    actualizarBotonDeshacer();
  }

  function actualizarBotonDeshacer(){
    btnDeshacer.style.display = undoStack.length > 0 ? "block" : "none";
  }

  function deshacer(){
    if(undoStack.length === 0) return;
    if(bloqueadoSinConexion()) return;
    const anterior = undoStack.pop();
    datos = JSON.parse(anterior);
    guardarDatos(datos);
    renderTodo();
    actualizarBotonDeshacer();
  }

  function pedirDeshacer(){
    if(undoStack.length === 0) return;
    confirmarGenerico("¿Confirmás deshacer el último cambio?", deshacer, "Sí, deshacer", "No");
  }

  btnDeshacer.addEventListener("click", pedirDeshacer);
  window.addEventListener("keydown", (e)=>{
    const z = e.key === "z" || e.key === "Z";
    if((e.ctrlKey || e.metaKey) && z){
      e.preventDefault();
      pedirDeshacer();
    }
  });

  function key(uIdx,sIdx){ return uIdx+"_"+sIdx; }

  // Armar encabezado
  const headRow = document.getElementById("headRow");

  let colAnchoPxActual = 18; // la usa después calcularYAplicarAlturaCuadrada, para el mismo ancho exacto

  function construirColgroup(){
    const n = COLUMNAS.length;
    // El ancho de columna ya lo calculó calcularTamanoCasillero() (a partir del alto
    // disponible, para que el casillero sea cuadrado y llene la pantalla verticalmente).
    const colAnchoPx = colAnchoPxActual;

    [ "colgroupHeader", "colgroupDatos" ].forEach(id=>{
      const colgroup = document.getElementById(id);
      colgroup.innerHTML = "";
      for(let i=0; i<n; i++){
        const col = document.createElement("col");
        col.style.width = colAnchoPx + "px";
        colgroup.appendChild(col);
      }
    });

    const anchoTotal = (n * colAnchoPx) + "px";
    const tablaHeaderDias = document.getElementById("tablaHeaderDias");
    const tablaDatos = document.getElementById("tablaDatos");
    tablaHeaderDias.style.width = anchoTotal;
    tablaHeaderDias.style.minWidth = anchoTotal;
    tablaDatos.style.width = anchoTotal;
    tablaDatos.style.minWidth = anchoTotal;
  }

  function corregirLineasFinde(){
    // Corrige la posición de cada línea de finde/semana usando el ancho REAL ya renderizado
    // (medido en píxeles), en vez de un % que se distorsiona un poco cuando varias columnas
    // se combinan en una sola celda (una reserva de varios días/semanas).
    const tablaDatos = document.getElementById("tablaDatos");
    if(!tablaDatos) return;
    const anchoTablaPx = tablaDatos.getBoundingClientRect().width;
    if(!anchoTablaPx) return;
    const n = COLUMNAS.length;
    const anchoColumnaPx = anchoTablaPx / n;
    document.querySelectorAll(".linea-finde[data-offset-columnas], .linea-hoy[data-offset-columnas]").forEach(linea=>{
      const offset = parseFloat(linea.dataset.offsetColumnas);
      linea.style.left = (offset * anchoColumnaPx) + "px";
    });
  }

  function calcularTamanoCasillero(){
    // ALTO: repartimos la altura disponible entre todas las unidades, así las filas llenan
    // la pantalla verticalmente (con un mínimo legible; si no entran, el panel scrollea).
    //
    // ANCHO: partimos del ancho "cuadrado" (mismo número que el alto de fila) pero, si con
    // eso la grilla no llega a cubrir el ancho de la pantalla, ESTIRAMOS las columnas hasta
    // llenarla. Antes no lo hacíamos y por eso en la notebook quedaba el calendario chiquito
    // y centrado, con un hueco grande a los costados. En el celu, donde el ancho disponible
    // es chico, gana el ancho cuadrado y la grilla scrollea en horizontal como siempre.
    const wrapDatos = document.getElementById("wrapDatos");
    const alturaDisponible = wrapDatos ? wrapDatos.clientHeight : 0;
    const anchoDisponible = wrapDatos ? wrapDatos.clientWidth : 0;
    const cantUnidades = (typeof UNIDADES !== "undefined" && UNIDADES.length) ? UNIDADES.length : 20;
    const esDiario = VISTAS[vistaActual].esDiario;

    let filaAlto = alturaDisponible > 0 ? (alturaDisponible / cantUnidades) : 38;
    if(!isFinite(filaAlto) || filaAlto < 26) filaAlto = 26;
    if(filaAlto > 90) filaAlto = 90;

    let colAnchoPx;
    if(esDiario){
      colAnchoPx = Math.max(14, Math.round(filaAlto / 2)); // 2 medias columnas = un día del mismo ancho que alto
    } else {
      colAnchoPx = Math.max(30, Math.round(filaAlto)); // Temporada: 1 columna = 1 semana, cuadrada
    }

    // Estirar para llenar el ancho, si sobra lugar.
    const nCols = (typeof COLUMNAS !== "undefined" && COLUMNAS.length) ? COLUMNAS.length : 0;
    if(anchoDisponible > 0 && nCols > 0){
      // Truncamos a 2 decimales (nunca redondeamos para arriba) para que el total no se pase
      // del ancho real y no aparezca una barra de scroll horizontal de 1 o 2 píxeles.
      const anchoParaLlenar = Math.floor((anchoDisponible / nCols) * 100) / 100;
      if(anchoParaLlenar > colAnchoPx) colAnchoPx = anchoParaLlenar;
    }

    // CASILLERO CUADRADO en las vistas de mes: una vez que sabemos el ancho real que va a
    // tener cada día (2 medias columnas), forzamos el alto de fila a ese mismo número. Así
    // el casillero queda cuadrado de verdad, como pidió Tomi. La contra es que las 20
    // unidades ya no entran todas de una y el panel scrollea en vertical — es el precio de
    // que el día sea cuadrado y no un rectángulo chato.
    // En Temporada NO aplica: ahí una columna es una semana entera (100px y pico de ancho),
    // y hacerla cuadrada dejaría filas gigantes.
    if(esDiario){
      const anchoDia = colAnchoPx * 2;
      filaAlto = Math.min(90, Math.max(26, anchoDia));
    } else {
      // Temporada: la columna es una semana entera, así que cuadrada no puede ser (quedarían
      // filas gigantes). Pero el ALTO de fila lo igualamos al de las vistas de mes, para que
      // al cambiar de pestaña la grilla se vea pareja. Usamos como referencia un mes de 30
      // días (= 60 medias columnas) y repetimos exactamente el mismo cálculo.
      const COLS_MES_REF = 60;
      let colMesRef = Math.max(14, Math.round(filaAlto / 2));
      if(anchoDisponible > 0){
        const a = Math.floor((anchoDisponible / COLS_MES_REF) * 100) / 100;
        if(a > colMesRef) colMesRef = a;
      }
      filaAlto = Math.min(90, Math.max(26, colMesRef * 2));

      // CELULAR: en pantalla angosta las 11 semanas entraban todas juntas a 30px cada una y
      // los nombres se partían en cuatro renglones ("Ami / ga / Laur / a"). Le damos a la
      // semana un ancho cómodo y que la grilla scrollee con el dedo, igual que en los meses.
      // El tope de 700px es para que esto NO toque la notebook ni la tablet, donde la semana
      // ya se estira sola hasta llenar la pantalla.
      if(anchoDisponible > 0 && anchoDisponible < 700){
        const anchoComodo = Math.round(filaAlto * 3);
        if(anchoComodo > colAnchoPx) colAnchoPx = anchoComodo;
      }
    }

    colAnchoPxActual = colAnchoPx;

    // Tamaño del bloque de reserva dentro del casillero. En las vistas de mes lo dejamos como
    // estaba (ya quedó bien). En Temporada, donde la columna es una semana muy ancha, lo
    // achicamos un poco en los dos ejes para que no quede tan invasivo, y el aire lateral es
    // proporcional al ancho de la semana.
    let altoSlot, insetX;
    if(esDiario){
      altoSlot = Math.max(14, filaAlto - 6);
      insetX = 2;
    } else {
      altoSlot = Math.max(14, Math.round(filaAlto * 0.76));
      insetX = Math.min(12, Math.max(3, Math.round(colAnchoPx * 0.07)));
    }
    document.documentElement.style.setProperty("--dia-alto", altoSlot + "px");
    document.documentElement.style.setProperty("--slot-inset-x", insetX + "px");
    document.documentElement.style.setProperty("--fila-alto", filaAlto + "px");

    // El bloque "Puerto Nuevo / BP 1" de la columna izquierda tiene que entrar entero dentro
    // del alto de fila. Cuando las filas quedaban chicas, el texto no entraba y se cortaba
    // por arriba. Acá calculamos el tamaño de letra máximo que entra en dos renglones.
    const espacioTexto = Math.max(12, filaAlto - 4); // descontando el padding de arriba y abajo
    let fNombre = Math.floor((espacioTexto / 1.98) * 10) / 10; // 2 renglones con line-height 1.1
    if(fNombre > 10) fNombre = 10;   // tope: no agrandamos más allá del diseño original
    if(fNombre < 7.5) fNombre = 7.5; // piso: nunca ilegible
    const fCodigo = Math.max(6.5, Math.round(fNombre * 0.8 * 10) / 10);
    document.documentElement.style.setProperty("--unit-font", fNombre + "px");
    document.documentElement.style.setProperty("--unit-code-font", fCodigo + "px");

    if(!esDiario){
      const altoHeader = Math.min(70, Math.max(40, filaAlto * 0.6));
      document.documentElement.style.setProperty("--fila-header-alto", altoHeader + "px");
    } else {
      document.documentElement.style.removeProperty("--fila-header-alto");
    }
  }

  function ajustarAlturaCuadrada(){
    calcularTamanoCasillero();
    construirColgroup();
    corregirLineasFinde();
  }

  function construirHeader(){
    calcularTamanoCasillero();
    headRow.innerHTML = "";
    document.getElementById("panelEsquina").textContent = "BP · " + VISTAS[vistaActual].titulo;

    if(VISTAS[vistaActual].esDiario){
      // Cada día real ocupa 2 columnas (mañana/tarde) en el cuerpo,
      // pero en el encabezado se ve como una sola celda por día.
      for(let i=0; i<COLUMNAS.length; i+=2){
        const s = COLUMNAS[i];
        const th = document.createElement("th");
        th.colSpan = 2;
        th.innerHTML = s.label + '<span class="rango">'+s.rango+'</span>';
        if(s.rango === "Vie" || s.rango === "Dom"){
          const linea = document.createElement("div");
          linea.className = "linea-finde";
          linea.style.left = "100%";
          linea.dataset.offsetColumnas = 2; // un día completo = 2 medias columnas
          th.appendChild(linea);
          th.style.borderRight = "none";
        }
        headRow.appendChild(th);
      }
    } else {
      COLUMNAS.forEach((s,i)=>{
        const th = document.createElement("th");
        th.innerHTML = s.label + '<span class="rango">'+s.rango+'</span>';
        if(i < COLUMNAS.length - 1){
          const linea = document.createElement("div");
          linea.className = "linea-finde";
          linea.style.left = "100%";
          linea.dataset.offsetColumnas = 1; // en Temporada cada columna es una semana entera
          th.appendChild(linea);
          th.style.borderRight = "none";
        }
        headRow.appendChild(th);
      });
    }

    construirColgroup();
  }

  // A partir de acá, todo espera a que Firebase esté listo y hayamos traído la primera copia
  // de datos de la pestaña activa — recién ahí se arma la tabla por primera vez.
  window.__appIniciada = false;
  try{
    await window.__fbAuthReady;
    datos = await esperarPrimerDato(vistaActual);
    cacheDatosPorVista[vistaActual] = datos;
  }catch(e){
    console.error("No se pudo conectar con Firebase, se usan los datos iniciales:", e);
    datos = DATOS_INICIALES_POR_VISTA[vistaActual] || {};
    cacheDatosPorVista[vistaActual] = datos;
  }

  construirHeader();

  // Armar cuerpo
  const body = document.getElementById("bodyTable");
  const bodyUnidades = document.getElementById("bodyUnidades");

  function agruparGenerico(datosVista, columnasVista, uIdx){
    const grupos = [];
    let i = 0;
    while(i < columnasVista.length){
      const d = datosVista[key(uIdx,i)];
      const ocupado = d && (d.nombre || d.nota);
      if(!ocupado){
        grupos.push({inicio:i, fin:i, ocupado:false});
        i++;
        continue;
      }
      const color = d.color || "rojo";
      const firma = (d.nombre||"") + "|" + (d.nota||"") + "|" + color;
      let j = i+1;
      while(j < columnasVista.length){
        const d2 = datosVista[key(uIdx,j)];
        const ocupado2 = d2 && (d2.nombre || d2.nota);
        if(!ocupado2) break;
        const color2 = d2.color || "rojo";
        const firma2 = (d2.nombre||"") + "|" + (d2.nota||"") + "|" + color2;
        if(firma2 !== firma) break;
        j++;
      }
      grupos.push({inicio:i, fin:j-1, ocupado:true, nombre:d.nombre||"", nota:d.nota||"", color:color});
      i = j;
    }
    return grupos;
  }

  function agruparSemanas(uIdx){
    return agruparGenerico(datos, COLUMNAS, uIdx);
  }

  function construirFilaUnidad(uIdx){
    const u = UNIDADES[uIdx];
    const tr = document.createElement("tr");
    const tdUnit = document.createElement("td");
    tdUnit.className = "unit";
    tdUnit.innerHTML = '<span class="unit-name">'+u.nombre+'</span><span class="unit-code">'+u.codigo+'</span>';
    tr.appendChild(tdUnit);
    return tr;
  }

  function construirFilaDatos(uIdx){
    const tr = document.createElement("tr");

    agruparSemanas(uIdx).forEach(g=>{
      const td = document.createElement("td");
      td.className = "cell";
      if(g.fin > g.inicio) td.colSpan = (g.fin - g.inicio + 1);
      // Si la celda TERMINA en la mitad "mañana" (índice par) le sacamos el borde derecho —
      // así no se ve ninguna línea "cortando" un día a la mitad, sea un casillero vacío o el
      // final de una reserva que hace checkout a la mañana.
      if(VISTAS[vistaActual].esDiario && g.fin % 2 === 0){
        td.classList.add("media-am");
      }
      // Línea de fin de semana: se inserta COMO PARTE de esta celda (antes que el bloque de
      // la reserva), en la posición exacta donde cae el finde dentro del rango de esta celda
      // — así, si hay una reserva larga que lo atraviesa, la tapa naturalmente en vez de
      // pasarle por encima; y si está vacío, se ve porque el casillero es transparente.
      if(VISTAS[vistaActual].esDiario){
        const spanLen = g.fin - g.inicio + 1;

        // Línea del día de hoy: al MEDIO del día, o sea en la frontera entre la media
        // columna de la mañana y la de la tarde — que es justo debajo del número del día.
        // Sólo se dibuja en los casilleros LIBRES: si la unidad tiene una reserva ese día,
        // la línea se corta en esa fila y sigue en la de abajo. Antes se dibujaba igual y
        // quedaba por detrás del bloque, pero como el bloque no ocupa toda la celda
        // (tiene aire a los costados y arriba) asomaban pedacitos desalineados.
        const idxHoy = indiceColumnaHoy();
        if(!g.ocupado && idxHoy >= g.inicio && idxHoy <= g.fin){
          const lineaHoy = document.createElement("div");
          lineaHoy.className = "linea-hoy";
          lineaHoy.style.left = ((idxHoy + 1 - g.inicio) / spanLen * 100) + "%";
          lineaHoy.dataset.offsetColumnas = (idxHoy + 1 - g.inicio);
          td.appendChild(lineaHoy);
        }

        for(let idx = g.inicio; idx <= g.fin; idx++){
          if(idx % 2 !== 1) continue; // solo nos importa el final de cada día (mitad "tarde")
          const rangoDia = COLUMNAS[idx].rango;
          if(rangoDia !== "Vie" && rangoDia !== "Dom") continue;
          const linea = document.createElement("div");
          linea.className = "linea-finde";
          // Posición aproximada con %, después se corrige con una medición real en píxeles
          // (calcularYAplicarAlturaCuadrada) — así no dependemos de adivinar cómo el navegador
          // reparte los bordes cuando varias columnas se combinan en una sola celda.
          linea.style.left = ((idx + 1 - g.inicio) / spanLen * 100) + "%";
          linea.dataset.offsetColumnas = (idx + 1 - g.inicio);
          td.appendChild(linea);
          // Si la línea gruesa cae justo en el borde derecho propio de esta celda, sacamos
          // el borde finito de siempre ahí — si no, quedan las dos líneas juntas, una fina
          // pegada a la gruesa, y se ve desprolijo.
          if(idx === g.fin){
            td.style.borderRight = "none";
          }
        }
      } else {
        // Temporada: no hay "días", pero separamos cada semana con la misma línea (mismo
        // grosor, y también pasa por detrás si hay una reserva que ocupa varias semanas).
        const spanLen = g.fin - g.inicio + 1;
        for(let idx = g.inicio; idx <= g.fin; idx++){
          if(idx === COLUMNAS.length - 1) continue; // no hace falta después de la última semana
          const linea = document.createElement("div");
          linea.className = "linea-finde";
          linea.style.left = ((idx + 1 - g.inicio) / spanLen * 100) + "%";
          linea.dataset.offsetColumnas = (idx + 1 - g.inicio);
          td.appendChild(linea);
          if(idx === g.fin){
            td.style.borderRight = "none";
          }
        }
      }

      const slot = document.createElement("div");
      const claseColor = g.ocupado ? (g.color === "rojo" ? "confirmado" : g.color) : "";
      slot.className = "slot" + (claseColor ? " "+claseColor : "");
      slot.textContent = g.ocupado ? g.nombre : "";

      slot.addEventListener("click", ()=>{
        if(g.ocupado){
          const rango = [];
          for(let k=g.inicio;k<=g.fin;k++) rango.push(k);
          abrirDialogo(uIdx, rango);
        } else if(VISTAS[vistaActual].esDiario){
          // Sin importar qué mitad tocaste, el alta siempre arranca a la tarde (checkin 14:00) del día tocado
          const diaIdx = Math.floor(g.inicio / 2);
          const inicioForzado = diaIdx*2 + 1; // índice de la "tarde" de ese día
          abrirDialogo(uIdx, [inicioForzado]);
        } else {
          abrirDialogo(uIdx, [g.inicio]);
        }
      });

      td.appendChild(slot);
      tr.appendChild(td);
    });

    return tr;
  }

  function renderTodo(){
    body.innerHTML = "";
    bodyUnidades.innerHTML = "";
    UNIDADES.forEach((u,uIdx)=>{
      bodyUnidades.appendChild(construirFilaUnidad(uIdx));
      body.appendChild(construirFilaDatos(uIdx));
    });
  }

  renderTodo();
  ajustarAlturaCuadrada();
  requestAnimationFrame(ajustarAlturaCuadrada);

  // La altura real de la barra de arriba puede variar según el dispositivo/navegador — la
  // medimos y la aplicamos, en vez de usar un número fijo (eso dejaba un hueco en la notebook).
  function ajustarAlturaTopBar(){
    const topBar = document.getElementById("topBar");
    if(topBar) document.documentElement.style.setProperty("--topbar-alto", topBar.offsetHeight + "px");
  }
  ajustarAlturaTopBar();
  requestAnimationFrame(ajustarAlturaTopBar);
  window.addEventListener("resize", ajustarAlturaTopBar);

  function refrescarFila(uIdx){
    const filas = body.querySelectorAll("tr");
    filas[uIdx].replaceWith(construirFilaDatos(uIdx));
    const filasUnidad = bodyUnidades.querySelectorAll("tr");
    filasUnidad[uIdx].replaceWith(construirFilaUnidad(uIdx));
  }

  // Dialogo
  const dlg = document.getElementById("dlg");
  const dlgTitle = document.getElementById("dlgTitle");
  const dlgSub = document.getElementById("dlgSub");
  const inpNombre = document.getElementById("inpNombre");
  inpNombre.addEventListener("input", ()=>{
    if(inpNombre.value.trim()) document.getElementById("avisoNombre").style.display = "none";
  });
  const inpNota = document.getElementById("inpNota");
  const inpDuracion = document.getElementById("inpDuracion");
  const duracionRow = document.getElementById("duracionRow");
  const rangoFechaRow = document.getElementById("rangoFechaRow");
  const txtDesde = document.getElementById("txtDesde");
  const txtNoches = document.getElementById("txtNoches");
  const txtSale = document.getElementById("txtSale");
  const btnNochesMenos = document.getElementById("btnNochesMenos");
  const btnNochesMas = document.getElementById("btnNochesMas");
  const dlgNormal = document.getElementById("dlgNormal");
  const dlgConfirm = document.getElementById("dlgConfirm");
  const dlgConfirmMsg = document.getElementById("dlgConfirmMsg");
  const btnConfirmSi = document.getElementById("btnConfirmSi");
  const btnConfirmNo = document.getElementById("btnConfirmNo");
  let dlgU=null, dlgRango=[], dlgColor="rojo", dlgNochesActuales=1;

  // Panel de confirmación propio (no depende del confirm() nativo del navegador,
  // que en algunos navegadores/apps integradas no funciona)
  function pedirConfirmacion(msg, alConfirmar, labelSi, labelNo){
    dlgConfirmMsg.textContent = msg;
    btnConfirmSi.textContent = labelSi || "Sí";
    btnConfirmNo.textContent = labelNo || "No, volver";
    dlgNormal.style.display = "none";
    dlgConfirm.style.display = "block";

    const onSi = ()=>{
      limpiar();
      alConfirmar();
    };
    const onNo = ()=>{
      limpiar();
    };
    function limpiar(){
      dlgConfirm.style.display = "none";
      dlgNormal.style.display = "";
      btnConfirmSi.removeEventListener("click", onSi);
      btnConfirmNo.removeEventListener("click", onNo);
    }
    btnConfirmSi.addEventListener("click", onSi);
    btnConfirmNo.addEventListener("click", onNo);
  }

  function marcarColorSeleccionado(){
    document.querySelectorAll(".color-opcion").forEach(op=>{
      const activo = op.dataset.color === dlgColor;
      op.querySelector(".color-swatch").classList.toggle("selected", activo);
    });
  }

  document.querySelectorAll(".color-opcion").forEach(op=>{
    op.addEventListener("click", ()=>{
      dlgColor = op.dataset.color;
      marcarColorSeleccionado();
    });
  });

  function abrirDialogo(uIdx, rango){
    // Sin conexión no se abre el cuadro de carga: es la puerta de entrada de todas las
    // altas, ediciones y borrados, así que bloqueándola acá quedan cubiertas las tres.
    if(bloqueadoSinConexion()) return;
    dlgU = uIdx; dlgRango = rango;
    dlgConfirm.style.display = "none";
    dlgNormal.style.display = "";
    document.getElementById("avisoNombre").style.display = "none";
    const u = UNIDADES[uIdx];
    const inicio = rango[0], fin = rango[rango.length-1];
    dlgTitle.textContent = u.nombre + " · " + u.codigo;
    function formatColumna(idx){
      const c = COLUMNAS[idx];
      if(VISTAS[vistaActual].esDiario){
        const [y,m,d] = c.inicio.split("-");
        const mesAbrev = MESES_ABREV[parseInt(m,10)-1];
        return c.diaSemanaCompleto + " " + parseInt(d,10) + " " + mesAbrev + " " + y.slice(2);
      }
      return c.label + " (" + c.rango + ")";
    }

    if(fin > inicio){
      dlgSub.textContent = formatColumna(inicio) + "  →  " + formatColumna(fin);
    } else {
      dlgSub.textContent = formatColumna(inicio);
    }

    const d = datos[key(uIdx,inicio)] || {};
    inpNombre.value = d.nombre || "";
    inpNota.value = d.nota || "";

    const esDiario = VISTAS[vistaActual].esDiario;
    if(esDiario){
      duracionRow.style.display = "none";
      rangoFechaRow.style.display = "flex";

      const nochesMax = Math.max(1, Math.floor((COLUMNAS.length - 1 - inicio) / 2));
      let noches = Math.max(1, Math.round((fin - inicio) / 2)) || 1;
      if(noches > nochesMax) noches = nochesMax;

      txtDesde.textContent = formatColumna(inicio);

      function actualizarContadorNoches(){
        txtNoches.textContent = noches;
        const idxSalida = inicio + noches*2 - 1;
        txtSale.textContent = formatColumna(Math.min(idxSalida, COLUMNAS.length-1));
        dlgNochesActuales = noches;
      }
      actualizarContadorNoches();

      btnNochesMenos.onclick = ()=>{
        if(noches > 1) noches--;
        actualizarContadorNoches();
      };
      btnNochesMas.onclick = ()=>{
        if(noches < nochesMax) noches++;
        actualizarContadorNoches();
      };
    } else {
      duracionRow.style.display = "flex";
      rangoFechaRow.style.display = "none";
      inpDuracion.value = rango.length;
      inpDuracion.max = COLUMNAS.length - inicio;
    }

    dlgColor = d.color || "rojo";
    marcarColorSeleccionado();
    dlg.showModal();
  }

  function borrarRango(rango){
    if(bloqueadoSinConexion()) return;   // por si la conexión se cayó con el diálogo abierto
    pushUndo();
    rango.forEach(sIdx=> delete datos[key(dlgU,sIdx)]);
    guardarDatos(datos);
    refrescarFila(dlgU);
    dlg.close();
  }

  document.getElementById("btnGuardar").addEventListener("click", ()=>{
    const nombreCargado = inpNombre.value.trim();
    const notaCargada = inpNota.value.trim();
    const quedaVacio = !nombreCargado && !notaCargada;
    const esDiarioMsg = VISTAS[vistaActual].esDiario;
    const inicio = dlgRango[0];
    const unidadTiempoPlural = "semanas";

    if(quedaVacio){
      const habiaAlgoAntes = dlgRango.some(sIdx=>{
        const d = datos[key(dlgU,sIdx)];
        return d && (d.nombre || d.nota);
      });

      if(!habiaAlgoAntes){
        // No había ninguna reserva acá: no es un borrado, simplemente falta el nombre.
        document.getElementById("avisoNombre").style.display = "block";
        inpNombre.focus();
        return;
      }

      const msg = esDiarioMsg
        ? "Esto va a borrar la reserva cargada en este tramo. ¿Confirmás?"
        : (dlgRango.length > 1
          ? "Esto va a borrar la reserva cargada en estas " + dlgRango.length + " " + unidadTiempoPlural + ". ¿Confirmás?"
          : "Esto va a borrar la reserva cargada en este casillero. ¿Confirmás?");
      pedirConfirmacion(msg, ()=> borrarRango(dlgRango), "Sí, borrar", "No, volver");
      return;
    }

    // Calculamos el rango final: por cantidad de noches en la vista diaria, o por duración numérica en la semanal
    let nuevoRango = [];
    if(VISTAS[vistaActual].esDiario){
      let noches = parseInt((document.getElementById("txtNoches").textContent || "1").trim(), 10) || 1;
      if(noches < 1) noches = 1;
      if(noches > 30) noches = 30; // tope duro de seguridad: nunca más de 30 noches de una carga
      let finElegido = inicio + noches*2 - 1;
      if(finElegido > COLUMNAS.length-1) finElegido = COLUMNAS.length-1;
      for(let k=inicio; k<=finElegido; k++) nuevoRango.push(k);
    } else {
      let duracion = parseInt(inpDuracion.value, 10) || 1;
      const maxDuracion = COLUMNAS.length - inicio;
      if(duracion < 1) duracion = 1;
      if(duracion > maxDuracion) duracion = maxDuracion;
      for(let k=0; k<duracion; k++) nuevoRango.push(inicio+k);
    }

    function aplicarGuardado(){
      if(bloqueadoSinConexion()) return;   // por si la conexión se cayó con el diálogo abierto
      pushUndo();
      dlgRango.forEach(sIdx=>{
        if(!nuevoRango.includes(sIdx)) delete datos[key(dlgU,sIdx)];
      });
      nuevoRango.forEach(sIdx=>{
        datos[key(dlgU,sIdx)] = {estado:"confirmado", nombre:nombreCargado, nota:notaCargada, color:dlgColor};
      });
      guardarDatos(datos);
      refrescarFila(dlgU);
      dlg.close();
    }

    // Si el nuevo rango pisa semanas/días de OTRA reserva (nombre distinto), lo avisamos en el mismo mensaje
    const conflictos = nuevoRango.filter(sIdx=>{
      if(dlgRango.includes(sIdx)) return false; // ya era parte de este mismo bloque
      const d = datos[key(dlgU,sIdx)];
      return d && (d.nombre || d.nota) && d.nombre !== nombreCargado;
    });

    const habiaAlgoAntes = dlgRango.some(sIdx=>{
      const d = datos[key(dlgU,sIdx)];
      return d && (d.nombre || d.nota);
    });

    let msg, labelSi;
    const finElegidoReal = nuevoRango[nuevoRango.length-1];
    const cantidadNoches = esDiarioMsg ? Math.round((finElegidoReal - inicio) / 2) : null;
    const esNochesInusuales = esDiarioMsg && cantidadNoches !== null && cantidadNoches >= 10;
    const rangoFechasTexto = esDiarioMsg
      ? (esNochesInusuales
          ? " ⚠️ OJO: son " + cantidadNoches + " noches — del " + fechaLegible(COLUMNAS[inicio].inicio) + " al " + fechaLegible(COLUMNAS[finElegidoReal].inicio) + ". Si no era esa la fecha, tocá \"No, volver\" y revisá el campo Hasta."
          : " Del " + fechaLegible(COLUMNAS[inicio].inicio) + " al " + fechaLegible(COLUMNAS[finElegidoReal].inicio) + ".")
      : "";

    if(conflictos.length > 0){
      const nombresConflicto = [...new Set(conflictos.map(sIdx=> (datos[key(dlgU,sIdx)]||{}).nombre || "(sin nombre)"))].join(", ");
      msg = esDiarioMsg
        ? "Ojo: vas a pisar la reserva de \"" + nombresConflicto + "\" en este tramo." + rangoFechasTexto + " ¿Confirmás?"
        : "Ojo: vas a pisar la reserva de \"" + nombresConflicto + "\" en " + conflictos.length + " " + unidadTiempoPlural + ". ¿Confirmás?";
      labelSi = "Sí, pisar reserva";
    } else if(habiaAlgoAntes){
      msg = esDiarioMsg
        ? "¿Confirmás modificar esta reserva?" + rangoFechasTexto
        : (nuevoRango.length > 1
          ? "¿Confirmás modificar esta reserva en estas " + nuevoRango.length + " " + unidadTiempoPlural + "?"
          : "¿Confirmás modificar esta reserva?");
      labelSi = "Sí, modificar";
    } else {
      msg = esDiarioMsg
        ? "¿Confirmás cargar esta reserva?" + rangoFechasTexto
        : (nuevoRango.length > 1
          ? "¿Confirmás cargar esta reserva para " + nuevoRango.length + " " + unidadTiempoPlural + "?"
          : "¿Confirmás cargar esta reserva?");
      labelSi = "Sí, cargar";
    }

    pedirConfirmacion(msg, aplicarGuardado, labelSi, "No, volver");
  });

  // ---- Avisos de ingreso (día antes del check-in) ----
  const NOTIF_KEY = "buenpuerto_2027_notif_ok";

  function hoyISO(){
    const d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }

  function sumarDias(fechaISO, dias){
    const d = new Date(fechaISO+"T00:00:00");
    d.setDate(d.getDate()+dias);
    return d;
  }

  function mismodia(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function ingresosDeManana(){
    const hoy = hoyISO();
    const resultado = [];

    if(VISTAS[vistaActual].esDiario){
      // Usamos los bloques ya agrupados (una reserva = un bloque), y nos fijamos si el
      // PRIMER día de ese bloque (el check-in real) es mañana — así no se duplica entre
      // la mitad de mañana/tarde ni se confunde con días intermedios de una estadía larga.
      UNIDADES.forEach((u, uIdx)=>{
        const grupos = agruparGenerico(datos, COLUMNAS, uIdx);
        grupos.forEach(g=>{
          if(!g.ocupado) return;
          const fechaInicio = COLUMNAS[g.inicio].inicio;
          const diaAntes = sumarDias(fechaInicio, -1);
          if(mismodia(hoy, diaAntes)){
            resultado.push({unidad:u.nombre, codigo:u.codigo, nombre:g.nombre || "(sin nombre cargado)"});
          }
        });
      });
      return resultado;
    }

    COLUMNAS.forEach((s, sIdx)=>{
      const diaAntes = sumarDias(s.inicio, -1);
      if(mismodia(hoy, diaAntes)){
        UNIDADES.forEach((u, uIdx)=>{
          const d = datos[key(uIdx,sIdx)];
          if(d && d.estado === "confirmado"){
            resultado.push({unidad:u.nombre, codigo:u.codigo, nombre:d.nombre || "(sin nombre cargado)", semana:s});
          }
        });
      }
    });
    return resultado;
  }

  // "Paneles inmovilizados", como en Excel: la esquina, la fila de días y la columna de
  // unidades NUNCA se tocan directamente — el usuario solo scrollea el panel de datos
  // (wrapDatos), y acá lo replicamos a los otros dos. Esto no depende de ningún truco de CSS
  // (sticky, position:fixed, etc.) que el navegador pueda interpretar distinto según el
  // dispositivo — es la forma más simple y confiable de "congelar" filas/columnas.
  const wrapDatos = document.getElementById("wrapDatos");
  const wrapHeaderDias = document.getElementById("wrapHeaderDias");
  const wrapUnidades = document.getElementById("wrapUnidades");
  const scrollWrap = wrapDatos; // alias para el resto del código que ya usaba este nombre

  const tablaHeaderDias = document.getElementById("tablaHeaderDias");
  const tablaUnidades = document.getElementById("tablaUnidades");

  function sincronizarPaneles(){
    // Usamos "transform" en vez de asignar scrollLeft/scrollTop: el navegador lo aplica
    // en el mismo instante (es una operación puramente visual), mientras que mover el
    // scroll de otro elemento pasa por su propio mecanismo interno y puede sentirse con
    // un pequeño retraso — que es justo lo que veíamos como "dos cosas separadas".
    tablaHeaderDias.style.transform = "translateX(" + (-wrapDatos.scrollLeft) + "px)";
    tablaUnidades.style.transform = "translateY(" + (-wrapDatos.scrollTop) + "px)";
  }

  wrapDatos.addEventListener("scroll", sincronizarPaneles, {passive:true});

  // ---- Cambio de pestaña (Temporada / Septiembre 2026) ----
  function cambiarVista(nuevaVista, posicionScroll){
    if(nuevaVista === vistaActual) return;
    vistaActual = nuevaVista;
    COLUMNAS = VISTAS[vistaActual].columnas;
    // Los datos de todas las pestañas ya se están escuchando en tiempo real desde el arranque;
    // si por algún motivo todavía no llegó el primer dato, usamos el inicial como puente.
    datos = cacheDatosPorVista[vistaActual] || DATOS_INICIALES_POR_VISTA[vistaActual] || {};

    // El deshacer es por pestaña: al cambiar de vista arrancamos su propio historial
    undoStack.length = 0;
    actualizarBotonDeshacer();
    actualizarEstadoConexion();   // el aviso es por pestaña: puede fallar una y el resto no

    document.querySelectorAll(".tab-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.vista === nuevaVista);
    });

    construirHeader();
    renderTodo();
    ajustarAlturaCuadrada();
    requestAnimationFrame(ajustarAlturaCuadrada);
    chequearAvisos();

    if(posicionScroll === "fin"){
      requestAnimationFrame(()=>{
        scrollWrap.scrollLeft = scrollWrap.scrollWidth;
        sincronizarPaneles();
      });
    } else {
      scrollWrap.scrollLeft = 0;
      sincronizarPaneles();
    }

    // Acompañamos el cambio: la pestaña activa se desplaza sola a la vista dentro de la barra
    // de arriba (importante en el celu). Va al final y blindado: si esto llegara a fallar en
    // algún navegador, nunca debe impedir que el cambio de mes ya hecho arriba funcione.
    try{
      const tabActivo = document.querySelector('#tabBar .tab-btn[data-vista="'+nuevaVista+'"]');
      if(tabActivo && typeof tabActivo.scrollIntoView === "function"){
        tabActivo.scrollIntoView({inline:"center", block:"nearest"});
      }
    }catch(e){
      console.error("No se pudo desplazar la pestaña activa a la vista:", e);
    }
  }

  function isoLocal(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  // ---- Buscador de inquilinos (busca en TODAS las pestañas, no solo la activa) ----
  function obtenerDatosDeVista(vistaKey){
    if(vistaKey === vistaActual) return datos;
    return cacheDatosPorVista[vistaKey] || DATOS_INICIALES_POR_VISTA[vistaKey] || {};
  }

  function formatColumnaDe(columnasVista, esDiarioVista, idx){
    const c = columnasVista[idx];
    if(esDiarioVista){
      const [y,m,d] = c.inicio.split("-");
      const mesAbrev = MESES_ABREV[parseInt(m,10)-1];
      return c.diaSemanaCompleto + " " + parseInt(d,10) + " " + mesAbrev + " " + y.slice(2);
    }
    return c.label + " (" + c.rango + ")";
  }

  function buscarInquilinos(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const resultados = [];
    Object.keys(VISTAS).forEach(vistaKey=>{
      const vista = VISTAS[vistaKey];
      const datosVista = obtenerDatosDeVista(vistaKey);
      UNIDADES.forEach((u, uIdx)=>{
        const grupos = agruparGenerico(datosVista, vista.columnas, uIdx);
        grupos.forEach(g=>{
          if(g.ocupado && g.nombre && g.nombre.toLowerCase().includes(q)){
            const rangoTexto = g.fin > g.inicio
              ? formatColumnaDe(vista.columnas, vista.esDiario, g.inicio) + "  →  " + formatColumnaDe(vista.columnas, vista.esDiario, g.fin)
              : formatColumnaDe(vista.columnas, vista.esDiario, g.inicio);
            resultados.push({
              vistaKey, vistaTitulo: vista.titulo,
              uIdx, unidadNombre: u.nombre, unidadCodigo: u.codigo,
              inicio: g.inicio, fin: g.fin, nombre: g.nombre, nota: g.nota, rangoTexto
            });
          }
        });
      });
    });
    return resultados;
  }

  // ---- Botón "Hoy": va directo a la fecha de hoy, sin importar en qué pestaña estés ----
  function columnaContieneFecha(col, esDiarioVista, fechaISO){
    if(esDiarioVista) return col.inicio === fechaISO;
    const finSemana = isoLocal(sumarDias(col.inicio, 6));
    return fechaISO >= col.inicio && fechaISO <= finSemana;
  }

  function irAHoy(){
    const hoyStr = isoLocal(new Date());
    let vistaEncontrada = null;
    let indiceEncontrado = null;

    for(const vistaKey of Object.keys(VISTAS)){
      const vista = VISTAS[vistaKey];
      let ultimoMatch = null;
      for(let i=0; i<vista.columnas.length; i++){
        if(columnaContieneFecha(vista.columnas[i], vista.esDiario, hoyStr)){
          ultimoMatch = i;
        }
      }
      if(ultimoMatch !== null){
        vistaEncontrada = vistaKey;
        indiceEncontrado = ultimoMatch;
        break;
      }
    }

    if(!vistaEncontrada){
      mostrarToast("Hoy no está dentro de ninguno de los calendarios cargados.");

  // ---- Exportar a Google Calendar (.ics) ----
  function pad2(n){ return String(n).padStart(2, "0"); }

  function fechaICSallDay(fechaISO){
    // fechaISO viene como "YYYY-MM-DD"
    return fechaISO.replace(/-/g, "");
  }

  function fechaICSconHora(fechaISO, hora, minuto){
    const [y,m,d] = fechaISO.split("-");
    return y + m + d + "T" + pad2(hora) + pad2(minuto) + "00";
  }

  function escaparICS(txt){
    return String(txt).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }

  function fechaLegible(iso){
    const [y,m,d] = iso.split("-");
    return d + "/" + m + "/" + y;
  }

  function generarEventosDeVista(vistaKey){
    const vista = VISTAS[vistaKey];
    const datosVista = obtenerDatosDeVista(vistaKey);
    const eventos = [];

    UNIDADES.forEach((u, uIdx)=>{
      const grupos = agruparGenerico(datosVista, vista.columnas, uIdx);
      grupos.forEach(g=>{
        if(!g.ocupado) return;
        const colIni = vista.columnas[g.inicio];
        const colFin = vista.columnas[g.fin];
        let dtStart, dtEnd, allDay, descripcion;

        if(vista.esDiario){
          // Un solo evento el día de ingreso (14:00), de 1 hora — el rango completo va en la descripción
          dtStart = fechaICSconHora(colIni.inicio, 14, 0);
          dtEnd = fechaICSconHora(colIni.inicio, 15, 0);
          allDay = false;
          descripcion = "Estadía del " + fechaLegible(colIni.inicio) + " al " + fechaLegible(colFin.inicio) + " (checkout 10:00 hs)";
        } else {
          // Un solo día (all-day) en el inicio de la primer semana — el rango completo va en la descripción
          const finRango = isoLocal(sumarDias(colFin.inicio, 6));
          dtStart = fechaICSallDay(colIni.inicio);
          dtEnd = fechaICSallDay(isoLocal(sumarDias(colIni.inicio, 1)));
          allDay = true;
          descripcion = "Estadía del " + fechaLegible(colIni.inicio) + " al " + fechaLegible(finRango);
        }

        if(g.nota) descripcion += " — " + g.nota;

        eventos.push({
          uid: "bp-" + vistaKey + "-" + uIdx + "-" + g.inicio + "-" + g.fin + "@buenpuerto",
          titulo: "Ingreso: " + g.nombre + " — " + u.nombre + " (" + u.codigo + ")",
          descripcion: escaparICS(descripcion),
          dtStart, dtEnd, allDay
        });
      });
    });

    return eventos;
  }

  function generarICS(){
    const ahora = new Date();
    const dtStamp = ahora.getUTCFullYear()+pad2(ahora.getUTCMonth()+1)+pad2(ahora.getUTCDate())+"T"+pad2(ahora.getUTCHours())+pad2(ahora.getUTCMinutes())+pad2(ahora.getUTCSeconds())+"Z";

    let eventos = [];
    Object.keys(VISTAS).forEach(vistaKey=>{
      eventos = eventos.concat(generarEventosDeVista(vistaKey));
    });

    const lineas = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Condominio Buen Puerto//Calendario//ES",
      "CALSCALE:GREGORIAN"
    ];

    eventos.forEach(ev=>{
      lineas.push("BEGIN:VEVENT");
      lineas.push("UID:" + ev.uid);
      lineas.push("DTSTAMP:" + dtStamp);
      if(ev.allDay){
        lineas.push("DTSTART;VALUE=DATE:" + ev.dtStart);
        lineas.push("DTEND;VALUE=DATE:" + ev.dtEnd);
      } else {
        lineas.push("DTSTART:" + ev.dtStart);
        lineas.push("DTEND:" + ev.dtEnd);
      }
      lineas.push("SUMMARY:" + escaparICS(ev.titulo));
      if(ev.descripcion) lineas.push("DESCRIPTION:" + ev.descripcion);
      // Recordatorio: 1 día antes
      lineas.push("BEGIN:VALARM");
      lineas.push("ACTION:DISPLAY");
      lineas.push("DESCRIPTION:Recordatorio ingreso — " + escaparICS(ev.titulo));
      lineas.push("TRIGGER:-P1D");
      lineas.push("END:VALARM");
      lineas.push("END:VEVENT");
    });

    lineas.push("END:VCALENDAR");
    return lineas.join("\r\n");
  }

  document.getElementById("btnExportarCal").addEventListener("click", ()=>{
    const contenido = generarICS();
    const blob = new Blob([contenido], {type: "text/calendar;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "buen-puerto-reservas.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    mostrarToast("Listo — se descargó el archivo. Importalo en Google Calendar (calendar.google.com → Ajustes → Importar).");
  });
