<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buen Puerto — Temporada 2027</title>
<style>
  :root{
    --navy:#1b2a4a;
    --navy-dark:#152238;
    --gold:#d4a94a;
    --confirmado:#c0392b;
    --color-violeta:#7e57c2;
    --color-amarillo:#e0ab2c;
    --libre-alt:#eaf4fa;
    --text:#1b2a4a;
    --muted:#8a93a3;
    --border:#e2e6ec;

    /* paleta oscura, solo para el área del calendario (no para el diálogo) */
    --cal-bg:#101c34;
    --cal-bg-alt:#233457;
    --cal-border:rgba(255,255,255,.08);
    --cal-text-muted:#94a3c2;
    --cal-dash:rgba(255,255,255,.28);
    --dia-alto:30px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--cal-bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);}

  .tab-btn{
    background:#1f3157;border:none;border-radius:20px;
    padding:8px 14px;font-size:11px;font-weight:600;
    color:#fff;cursor:pointer;white-space:nowrap;
  }
  .tab-btn.active{background:var(--gold);color:var(--navy-dark);}

  .scroll-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;}
  thead th{
    background:var(--navy);
    color:var(--gold);
    font-size:10.5px;
    font-weight:700;
    text-align:center;
    padding:10px 4px;
    position:sticky;top:0;
    z-index:15;
    border-right:1px solid rgba(255,255,255,.08);
  }
  thead th .rango{display:block;color:#c9d2e2;font-weight:400;font-size:9.5px;margin-top:2px;}
  thead th:first-child{
    text-align:left;
    padding-left:8px;
    color:var(--gold);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.3px;
    position:sticky;left:0;top:0;z-index:20;
  }

  tbody td.unit{
    position:sticky;left:0;
    background:inherit;
    padding:8px 4px 8px 8px;
    border-right:2px solid var(--gold);
    overflow:hidden;
    z-index:8;
  }
  tbody tr:nth-child(odd) td.unit{background:var(--cal-bg);}
  tbody tr:nth-child(even) td.unit{background:var(--cal-bg-alt);}

  .unit-name{font-size:11px;font-weight:600;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .unit-code{font-size:9px;color:var(--cal-text-muted);display:block;margin-top:1px;white-space:nowrap;}

  td.cell{
    padding:3px 2px;
    text-align:center;
    border-right:1px solid var(--cal-border);
  }
  td.cell.media-am{border-right:none;}
  tbody tr:nth-child(odd) td.cell{background:var(--cal-bg);}
  tbody tr:nth-child(even) td.cell{background:var(--cal-bg-alt);}

  .slot{
    height:var(--dia-alto);
    border-radius:6px;
    background:transparent;
    border:none;
    cursor:pointer;
    transition:transform .08s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:7px;line-height:1.05;font-weight:700;color:#fff;
    text-align:center;
    white-space:normal;
    word-break:break-word;
    overflow:hidden;
    padding:1px 3px;
    user-select:none;
  }
  .slot:active{transform:scale(.94);}
  .slot.confirmado{background:var(--confirmado); border:none;}
  .slot.violeta{background:var(--color-violeta); border:none;}
  .slot.amarillo{background:var(--color-amarillo); border:none; color:var(--navy);}

  #fixedHeadInner table{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  #fixedHeadInner thead th{position:static !important;}

  footer{
    background:var(--navy-dark);
    padding:10px 16px;
    text-align:center;
    font-size:10px;
    color:#7d88a0;
  }

  dialog{
    border:none;border-radius:12px;padding:0;width:min(320px,88vw);
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop{background:rgba(21,34,56,.55);}
  .dlg-head{background:var(--navy);color:#fff;padding:14px 16px;font-size:14px;font-weight:600;}
  .dlg-head small{display:block;color:var(--gold);font-weight:400;font-size:11px;margin-top:2px;}
  .dlg-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .dlg-body input{
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;
  }
  .duracion-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .duracion-row label{font-size:12px;color:var(--muted);}
  .duracion-row input{width:60px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:13px;text-align:center;}
  .duracion-row select{flex:1;min-width:90px;border:1px solid var(--border);border-radius:8px;padding:6px 6px;font-size:12.5px;}
  .duracion-row select:disabled{background:#f4f5f7;color:var(--muted);}

  .color-picker{display:flex;flex-direction:column;gap:8px;padding-top:2px;}
  .color-opcion{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;padding:2px 0;text-align:left;}
  .color-opcion span.texto{font-size:12px;font-weight:600;color:var(--text);}
  .color-swatch{
    width:24px;height:24px;border-radius:50%;
    border:2px solid transparent;cursor:pointer;
    padding:0;flex-shrink:0;
  }
  .swatch-rojo{background:var(--confirmado);}
  .swatch-violeta{background:var(--color-violeta);}
  .swatch-amarillo{background:var(--color-amarillo);}
  .color-swatch.selected{border-color:var(--navy); box-shadow:0 0 0 2px #fff inset;}

  /* Solo en pantallas de celu: columna de unidades un poco más ancha y nombre en 2 líneas
     en vez de cortado con "...". No afecta a la notebook/desktop. */
  @media (max-width: 600px){
    #mainTable colgroup col:first-child{ width:112px !important; }
    .unit-name{
      white-space:normal !important;
      overflow:visible !important;
      text-overflow:clip !important;
      line-height:1.2;
    }
  }

  .dlg-actions{display:flex;gap:8px;padding:0 16px 16px;}
  .dlg-actions button{
    flex:1;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn-guardar{background:var(--navy);color:#fff;}
  .btn-borrar{background:#f1f2f4;color:var(--text);}
  .btn-cerrar{background:transparent;color:var(--muted);}
</style>
</head>
<body>

<div id="toastBox" style="display:none; position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:70; background:var(--navy); color:#fff; padding:10px 16px; border-radius:10px; font-size:12.5px; box-shadow:0 6px 18px rgba(0,0,0,.3); max-width:88vw; text-align:center;"></div>

<div id="avisoBox" style="display:none; margin:10px 16px; padding:12px 14px; background:#fff4e0; border:1px solid #eecf9a; border-radius:10px; font-size:13px; color:#7a5310;"></div>

<div id="fixedHead" style="display:none; position:fixed; top:0; left:0; right:0; overflow:hidden; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.15);">

<script type="module">
  // ---- Conexión a Firebase (Firestore = base de datos compartida, Auth anónima = seguridad) ----
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCEYSLt4NDCLZ7xpUR3h8tdVBSjDiZ0lXE",
    authDomain: "calendario-app-bp.firebaseapp.com",
    projectId: "calendario-app-bp",
    storageBucket: "calendario-app-bp.firebasestorage.app",
    messagingSenderId: "786928589358",
    appId: "1:786928589358:web:4943d9572bedd483abddbf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.__fb = { db, doc, getDoc, setDoc, onSnapshot };

  window.__fbAuthReady = new Promise((resolve, reject)=>{
    onAuthStateChanged(auth, (user)=>{
      if(user) resolve(user);
    });
    signInAnonymously(auth).catch((err)=>{
      console.error("Error de autenticación con Firebase:", err);
      reject(err);
    });
  });
</script>

  const UNIDADES = [
    {nombre:"Puerto Nuevo", codigo:"BP 1"},
    {nombre:"Puerto Deseado", codigo:"BP 2"},
    {nombre:"Puerto de la Boca", codigo:"BP 3"},

  const SEMANAS = [
    {label:"SEM 0", rango:"19–26 Dic", inicio:"2026-12-19"},
    {label:"SEM 1", rango:"26 Dic–2 Ene", inicio:"2026-12-26"},
    {label:"SEM 2", rango:"2–9 Ene", inicio:"2027-01-02"},
    {label:"SEM 3", rango:"9–16 Ene", inicio:"2027-01-09"},
    {label:"SEM 4", rango:"16–23 Ene", inicio:"2027-01-16"},
    {label:"SEM 5", rango:"23–30 Ene", inicio:"2027-01-23"},
    {label:"SEM 6", rango:"30 Ene–6 Feb", inicio:"2027-01-30"},
    {label:"SEM 7", rango:"6–13 Feb", inicio:"2027-02-06"},
    {label:"SEM 8", rango:"13–20 Feb", inicio:"2027-02-13"},
    {label:"SEM 9", rango:"20–27 Feb", inicio:"2027-02-20"},
  ];

  const DIAS_SEMANA = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const DIAS_SEMANA_COMPLETO = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const MESES_ABREV = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sept","Oct","Nov","Dic"];

  function generarDiasMes(anio, mesIndex0){
    const dias = [];
    const cantidad = new Date(anio, mesIndex0+1, 0).getDate();
    for(let d=1; d<=cantidad; d++){
      const fecha = new Date(anio, mesIndex0, d);
      const iso = fecha.getFullYear()+"-"+String(fecha.getMonth()+1).padStart(2,"0")+"-"+String(fecha.getDate()).padStart(2,"0");
      dias.push({label:String(d), rango:DIAS_SEMANA[fecha.getDay()], diaSemanaCompleto:DIAS_SEMANA_COMPLETO[fecha.getDay()], inicio:iso});
    }
    return dias;
  }

  // Cada día real se parte en 2 columnas (mañana/tarde) para poder tener
  // un checkout a la mañana y un checkin a la tarde en la misma unidad y día.
  function generarMediosDias(anio, mesIndex0){
    const dias = generarDiasMes(anio, mesIndex0);
    const medios = [];
    dias.forEach(d=>{
      medios.push({label:d.label, rango:d.rango, diaSemanaCompleto:d.diaSemanaCompleto, inicio:d.inicio, turno:"AM"});
      medios.push({label:d.label, rango:d.rango, diaSemanaCompleto:d.diaSemanaCompleto, inicio:d.inicio, turno:"PM"});
    });
    return medios;
  }

  const DIAS_SEP2026 = generarMediosDias(2026, 8);  // mes 8 = Septiembre (0-indexado)
  const DIAS_OCT2026 = generarMediosDias(2026, 9);  // Octubre
  const DIAS_NOV2026 = generarMediosDias(2026, 10); // Noviembre
  const DIAS_DIC2026 = generarMediosDias(2026, 11); // Diciembre

  const VISTAS = {
    temporada: {
      columnas: SEMANAS,
      storageKey: "buenpuerto_2027_calendario_v3",
      titulo: "TEMPORADA 2027",
      esDiario: false
    },
    sep2026: {
      columnas: DIAS_SEP2026,
      storageKey: "buenpuerto_sep2026_calendario_v2",
      titulo: "SEPTIEMBRE 2026",
      esDiario: true
    },
    oct2026: {
      columnas: DIAS_OCT2026,
      storageKey: "buenpuerto_oct2026_calendario_v2",
      titulo: "OCTUBRE 2026",
      esDiario: true
    },
    nov2026: {
      columnas: DIAS_NOV2026,
      storageKey: "buenpuerto_nov2026_calendario_v2",
      titulo: "NOVIEMBRE 2026",
      esDiario: true
    },
    dic2026: {
      columnas: DIAS_DIC2026,
      storageKey: "buenpuerto_dic2026_calendario_v2",
      titulo: "DICIEMBRE 2026",
      esDiario: true
    }
  };

  function detectarVistaDeHoy(){
    const hoyStr = isoLocal(new Date());
    const orden = ["sep2026", "oct2026", "nov2026", "dic2026", "temporada"];
    for(const vistaKey of orden){
      const vista = VISTAS[vistaKey];
      for(let i=0; i<vista.columnas.length; i++){
        if(columnaContieneFecha(vista.columnas[i], vista.esDiario, hoyStr)){
          return vistaKey;
        }
      }
    }
    return "temporada"; // si hoy no cae en ningún calendario cargado, arrancamos en Temporada como antes
  }

  let vistaActual = detectarVistaDeHoy();
  let COLUMNAS = VISTAS[vistaActual].columnas;
  let STORAGE_KEY = VISTAS[vistaActual].storageKey;

  // Marcamos como activa la pestaña que corresponda a hoy (el HTML trae Temporada marcada por defecto)
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.vista === vistaActual);
  });


  const DEFAULT_DATA_TEMPORADA = {
      "0_4": {estado:"confirmado", nombre:"Maria Laura (Amigos Ale ITALIA)", nota:"", color:"rojo"},
      "1_1": {estado:"confirmado", nombre:"Noelia (Amiga Laura Ponce )", nota:"", color:"rojo"},
      "1_4": {estado:"confirmado", nombre:"Ale y Jael Lacelli", nota:"", color:"rojo"},
      "1_5": {estado:"confirmado", nombre:"Ale y Jael Lacelli", nota:"", color:"rojo"},
      "1_6": {estado:"confirmado", nombre:"Ale y Jael Lacelli", nota:"", color:"rojo"},
      "2_1": {estado:"confirmado", nombre:"Mariela amiga Sabrina Cordoba", nota:"", color:"rojo"},
      "2_2": {estado:"confirmado", nombre:"Chapu Vilariño", nota:"", color:"rojo"},
      "2_3": {estado:"confirmado", nombre:"Chapu Vilariño", nota:"", color:"rojo"},
      "2_4": {estado:"confirmado", nombre:"Rizzuto Vanesa", nota:"", color:"rojo"},

  const DATOS_INICIALES_POR_VISTA = {
    temporada: DEFAULT_DATA_TEMPORADA,
    sep2026: DEFAULT_DATA_SEP2026,

  // ---- Capa de datos en tiempo real contra Firestore (reemplaza el localStorage local) ----
  const COLECCION_FIRESTORE = "calendario";
  const cacheDatosPorVista = {};       // última copia conocida de cada pestaña
  const listenersActivos = {};         // un listener en vivo por pestaña
  const syncIndicador = document.getElementById("syncIndicador");
  let datos = {};                      // datos de la pestaña activa (alias del cache)

  function mostrarIndicadorSync(){
    syncIndicador.style.display = "block";
    clearTimeout(mostrarIndicadorSync._t);
    mostrarIndicadorSync._t = setTimeout(()=>{ syncIndicador.style.display = "none"; }, 900);
  }

  function iniciarListenerVista(vistaKey){
    if(listenersActivos[vistaKey]) return;
    const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaKey);
    listenersActivos[vistaKey] = window.__fb.onSnapshot(ref, (snap)=>{
      let nuevosDatos;
      if(snap.exists()){
        nuevosDatos = snap.data().datos || {};
      } else {
        nuevosDatos = DATOS_INICIALES_POR_VISTA[vistaKey] || {};
        window.__fb.setDoc(ref, {datos: nuevosDatos}).catch(e=> console.error("Error sembrando datos iniciales:", e));
      }
      cacheDatosPorVista[vistaKey] = nuevosDatos;
      if(vistaKey === vistaActual){
        const esPrimeraCarga = !window.__appIniciada;
        datos = nuevosDatos;
        if(!esPrimeraCarga){
          mostrarIndicadorSync();
          renderTodo();
          ajustarAlturaCuadrada();
          chequearAvisos();
        }
      }
    }, (err)=>{
      console.error("Error escuchando cambios de " + vistaKey + ":", err);
      mostrarToast("No se pudo conectar con la base de datos en la nube.");
    });
  }

  function esperarPrimerDato(vistaKey){
    return new Promise((resolve)=>{
      const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaKey);
      const unsub = window.__fb.onSnapshot(ref, (snap)=>{
        unsub();
        let nuevosDatos;
        if(snap.exists()){
          nuevosDatos = snap.data().datos || {};
        } else {
          nuevosDatos = DATOS_INICIALES_POR_VISTA[vistaKey] || {};
          window.__fb.setDoc(ref, {datos: nuevosDatos}).catch(e=> console.error("Error sembrando datos iniciales:", e));
        }
        resolve(nuevosDatos);
      }, (err)=>{
        console.error("Error obteniendo " + vistaKey + ":", err);
        resolve(DATOS_INICIALES_POR_VISTA[vistaKey] || {});
      });
    });
  }

  function guardarDatos(data){
    cacheDatosPorVista[vistaActual] = data; // actualización local inmediata (optimista)
    const ref = window.__fb.doc(window.__fb.db, COLECCION_FIRESTORE, vistaActual);
    window.__fb.setDoc(ref, {datos: data}).catch(e=>{
      console.error("Error guardando en Firestore:", e);
      mostrarToast("No se pudo guardar en la nube — revisá tu conexión a internet.");
    });
  }

  // ---- Confirmación genérica (independiente del cuadro de carga, para el botón Deshacer) ----
  function confirmarGenerico(msg, alConfirmar, labelSi, labelNo){
    const dlg2 = document.getElementById("confirmGenDlg");
    document.getElementById("confirmGenMsg").textContent = msg;
    const btnSi = document.getElementById("confirmGenSi");
    const btnNo = document.getElementById("confirmGenNo");
    btnSi.textContent = labelSi || "Sí";
    btnNo.textContent = labelNo || "No";
    dlg2.showModal();
    const onSi = ()=>{ limpiar(); alConfirmar(); };
    const onNo = ()=>{ limpiar(); };
    function limpiar(){
      dlg2.close();
      btnSi.removeEventListener("click", onSi);
      btnNo.removeEventListener("click", onNo);
    }
    btnSi.addEventListener("click", onSi);
    btnNo.addEventListener("click", onNo);
  }

  // ---- Deshacer (como Ctrl+Z de Excel) ----
  const UNDO_MAX = 20;
  const undoStack = [];
  const btnDeshacer = document.getElementById("btnDeshacer");

  function pushUndo(){
    undoStack.push(JSON.stringify(datos));
    if(undoStack.length > UNDO_MAX) undoStack.shift();
    actualizarBotonDeshacer();
  }

  function actualizarBotonDeshacer(){
    btnDeshacer.style.display = undoStack.length > 0 ? "block" : "none";
  }

  function deshacer(){
    if(undoStack.length === 0) return;
    const anterior = undoStack.pop();
    datos = JSON.parse(anterior);
    guardarDatos(datos);
    renderTodo();
    actualizarBotonDeshacer();
  }

  function pedirDeshacer(){
    if(undoStack.length === 0) return;
    confirmarGenerico("¿Confirmás deshacer el último cambio?", deshacer, "Sí, deshacer", "No");
  }

  btnDeshacer.addEventListener("click", pedirDeshacer);
  window.addEventListener("keydown", (e)=>{
    const z = e.key === "z" || e.key === "Z";
    if((e.ctrlKey || e.metaKey) && z){
      e.preventDefault();
      pedirDeshacer();
    }
  });

  function key(uIdx,sIdx){ return uIdx+"_"+sIdx; }

  // Armar encabezado
  const headRow = document.getElementById("headRow");

  function construirColgroup(){
    const mainTable = document.getElementById("mainTable");
    let colgroup = mainTable.querySelector("colgroup");
    if(!colgroup){
      colgroup = document.createElement("colgroup");
      mainTable.insertBefore(colgroup, mainTable.firstChild);
    }
    colgroup.innerHTML = "";

    const n = COLUMNAS.length;
    const esDiario = VISTAS[vistaActual].esDiario;
    const unitPercent = esDiario ? 9 : 11;
    const colPercent = (100 - unitPercent) / n;
    const colMinPx = esDiario ? 15 : 76;
    const unitMinPx = esDiario ? 78 : 100;

    const colUnidad = document.createElement("col");
    colUnidad.style.width = unitPercent + "%";
    colgroup.appendChild(colUnidad);

    for(let i=0; i<n; i++){
      const col = document.createElement("col");
      col.style.width = colPercent + "%";
      colgroup.appendChild(col);
    }

    mainTable.style.minWidth = (unitMinPx + n*colMinPx) + "px";
  }

  function calcularYAplicarAlturaCuadrada(){
    const mainTable = document.getElementById("mainTable");
    if(!mainTable) return;
    const anchoTablaPx = mainTable.getBoundingClientRect().width;
    if(!anchoTablaPx) return;

    // No medimos celdas del cuerpo (pueden estar fusionadas si hay una reserva ahí, lo que
    // rompería el cálculo). En cambio, usamos el mismo % de columna que definimos en el
    // colgroup — así el resultado no depende de qué haya cargado en ningún casillero.
    const n = COLUMNAS.length;
    const unitPercent = 9;
    const colPercent = (100 - unitPercent) / n;
    const anchoMediaDiaPx = anchoTablaPx * (colPercent / 100);
    const anchoDiaCompletoPx = anchoMediaDiaPx * 2;

    const paddingVertical = 6; // 3px arriba + 3px abajo (td.cell)
    let altoSlot = anchoDiaCompletoPx - paddingVertical;
    // Tope de seguridad: un casillero de día jamás debería medir esto en ningún dispositivo real.
    // Si el cálculo da un número absurdo (por lo que sea), lo recortamos a un valor razonable
    // en vez de aplicar un tamaño roto.
    if(!isFinite(altoSlot) || altoSlot < 14) altoSlot = 14;
    if(altoSlot > 70) altoSlot = 70;
    document.documentElement.style.setProperty("--dia-alto", altoSlot + "px");
  }

  function ajustarAlturaCuadrada(){
    if(!VISTAS[vistaActual].esDiario){
      document.documentElement.style.removeProperty("--dia-alto");
      return;
    }
    // Esperamos a que el navegador termine de acomodar el layout antes de medir
    // (en el celu a veces el primer cálculo se hace antes de que la tabla se asiente del todo).
    requestAnimationFrame(()=>{
      requestAnimationFrame(calcularYAplicarAlturaCuadrada);
    });
  }

  function construirHeader(){
    headRow.innerHTML = "";
    const thUnidad = document.createElement("th");
    thUnidad.textContent = "BP · " + VISTAS[vistaActual].titulo;
    headRow.appendChild(thUnidad);

    if(VISTAS[vistaActual].esDiario){
      // Cada día real ocupa 2 columnas (mañana/tarde) en el cuerpo,
      // pero en el encabezado se ve como una sola celda por día.
      for(let i=0; i<COLUMNAS.length; i+=2){
        const s = COLUMNAS[i];
        const th = document.createElement("th");
        th.colSpan = 2;
        th.innerHTML = s.label + '<span class="rango">'+s.rango+'</span>';
        headRow.appendChild(th);
      }
    } else {
      COLUMNAS.forEach(s=>{
        const th = document.createElement("th");
        th.innerHTML = s.label + '<span class="rango">'+s.rango+'</span>';
        headRow.appendChild(th);
      });
    }

    construirColgroup();
  }

  // A partir de acá, todo espera a que Firebase esté listo y hayamos traído la primera copia
  // de datos de la pestaña activa — recién ahí se arma la tabla por primera vez.
  window.__appIniciada = false;
  try{
    await window.__fbAuthReady;
    datos = await esperarPrimerDato(vistaActual);
    cacheDatosPorVista[vistaActual] = datos;
  }catch(e){
    console.error("No se pudo conectar con Firebase, se usan los datos iniciales:", e);
    datos = DATOS_INICIALES_POR_VISTA[vistaActual] || {};
    cacheDatosPorVista[vistaActual] = datos;
  }

  construirHeader();

  // Armar cuerpo
  const body = document.getElementById("bodyTable");

  function agruparGenerico(datosVista, columnasVista, uIdx){
    const grupos = [];
    let i = 0;
    while(i < columnasVista.length){
      const d = datosVista[key(uIdx,i)];
      const ocupado = d && (d.nombre || d.nota);
      if(!ocupado){
        grupos.push({inicio:i, fin:i, ocupado:false});
        i++;
        continue;
      }
      const color = d.color || "rojo";
      const firma = (d.nombre||"") + "|" + (d.nota||"") + "|" + color;
      let j = i+1;
      while(j < columnasVista.length){
        const d2 = datosVista[key(uIdx,j)];
        const ocupado2 = d2 && (d2.nombre || d2.nota);
        if(!ocupado2) break;
        const color2 = d2.color || "rojo";
        const firma2 = (d2.nombre||"") + "|" + (d2.nota||"") + "|" + color2;
        if(firma2 !== firma) break;
        j++;
      }
      grupos.push({inicio:i, fin:j-1, ocupado:true, nombre:d.nombre||"", nota:d.nota||"", color:color});
      i = j;
    }
    return grupos;
  }

  function agruparSemanas(uIdx){
    return agruparGenerico(datos, COLUMNAS, uIdx);
  }

  function construirFila(uIdx){
    const u = UNIDADES[uIdx];
    const tr = document.createElement("tr");

    const tdUnit = document.createElement("td");
    tdUnit.className = "unit";
    tdUnit.innerHTML = '<span class="unit-name">'+u.nombre+'</span><span class="unit-code">'+u.codigo+'</span>';
    tr.appendChild(tdUnit);

    agruparSemanas(uIdx).forEach(g=>{
      const td = document.createElement("td");
      td.className = "cell";
      if(g.fin > g.inicio) td.colSpan = (g.fin - g.inicio + 1);
      // En vistas diarias, si la celda es la mitad "mañana" (índice par) le sacamos el borde
      // derecho, así solo queda la línea entre un día y el siguiente (no entre mañana/tarde).
      if(VISTAS[vistaActual].esDiario && g.inicio % 2 === 0){
        td.classList.add("media-am");
      }

      const slot = document.createElement("div");
      const claseColor = g.ocupado ? (g.color === "rojo" ? "confirmado" : g.color) : "";
      slot.className = "slot" + (claseColor ? " "+claseColor : "");
      slot.textContent = g.ocupado ? g.nombre : "";

      slot.addEventListener("click", ()=>{
        if(g.ocupado){
          const rango = [];
          for(let k=g.inicio;k<=g.fin;k++) rango.push(k);
          abrirDialogo(uIdx, rango);
        } else if(VISTAS[vistaActual].esDiario){
          // Sin importar qué mitad tocaste, el alta siempre arranca a la tarde (checkin 14:00) del día tocado
          const diaIdx = Math.floor(g.inicio / 2);
          const inicioForzado = diaIdx*2 + 1; // índice de la "tarde" de ese día
          abrirDialogo(uIdx, [inicioForzado]);
        } else {
          abrirDialogo(uIdx, [g.inicio]);
        }
      });

      td.appendChild(slot);
      tr.appendChild(td);
    });

    return tr;
  }

  function renderTodo(){
    body.innerHTML = "";
    UNIDADES.forEach((u,uIdx)=>{
      body.appendChild(construirFila(uIdx));
    });
  }

  renderTodo();
  ajustarAlturaCuadrada();

  function refrescarFila(uIdx){

  // Panel de confirmación propio (no depende del confirm() nativo del navegador,
  // que en algunos navegadores/apps integradas no funciona)
  function pedirConfirmacion(msg, alConfirmar, labelSi, labelNo){
    dlgConfirmMsg.textContent = msg;

    btnConfirmNo.textContent = labelNo || "No, volver";

  function abrirDialogo(uIdx, rango){
    dlgU = uIdx; dlgRango = rango;
    dlgConfirm.style.display = "none";
    dlgNormal.style.display = "";
    const u = UNIDADES[uIdx];
    const inicio = rango[0], fin = rango[rango.length-1];

    function formatColumna(idx){
      const c = COLUMNAS[idx];
      if(VISTAS[vistaActual].esDiario){
        const [y,m,d] = c.inicio.split("-");
        const mesAbrev = MESES_ABREV[parseInt(m,10)-1];
        return c.diaSemanaCompleto + " " + parseInt(d,10) + " " + mesAbrev + " " + y.slice(2);
      }
      return c.label + " (" + c.rango + ")";
    }

    if(fin > inicio){
      dlgSub.textContent = formatColumna(inicio) + "  →  " + formatColumna(fin);
    } else {
      dlgSub.textContent = formatColumna(inicio);
    }

    const d = datos[key(uIdx,inicio)] || {};
    inpNombre.value = d.nombre || "";
    inpNota.value = d.nota || "";

    const esDiario = VISTAS[vistaActual].esDiario;
    if(esDiario){

      const nochesMax = Math.max(1, Math.floor((COLUMNAS.length - 1 - inicio) / 2));
      let noches = Math.max(1, Math.round((fin - inicio) / 2)) || 1;
      if(noches > nochesMax) noches = nochesMax;

      txtDesde.textContent = formatColumna(inicio);

      function actualizarContadorNoches(){
        txtNoches.textContent = noches;
        const idxSalida = inicio + noches*2 - 1;
        txtSale.textContent = formatColumna(Math.min(idxSalida, COLUMNAS.length-1));
        dlgNochesActuales = noches;

      actualizarContadorNoches();

        if(noches > 1) noches--;

      btnNochesMas.onclick = ()=>{

      duracionRow.style.display = "flex";
      rangoFechaRow.style.display = "none";
      inpDuracion.value = rango.length;
      inpDuracion.max = COLUMNAS.length - inicio;

    dlgColor = d.color || "rojo";
    marcarColorSeleccionado();
    dlg.showModal();

  function borrarRango(rango){
    pushUndo();
    rango.forEach(sIdx=> delete datos[key(dlgU,sIdx)]);
    guardarDatos(datos);
    refrescarFila(dlgU);
    dlg.close();
  }

  document.getElementById("btnGuardar").addEventListener("click", ()=>{
    const nombreCargado = inpNombre.value.trim();
    const notaCargada = inpNota.value.trim();
    const quedaVacio = !nombreCargado && !notaCargada;
    const esDiarioMsg = VISTAS[vistaActual].esDiario;
    const inicio = dlgRango[0];
    const unidadTiempoPlural = "semanas";

    if(quedaVacio){
      const msg = esDiarioMsg
        ? "Esto va a borrar la reserva cargada en este tramo. ¿Confirmás?"
        : (dlgRango.length > 1
          ? "Esto va a borrar la reserva cargada en estas " + dlgRango.length + " " + unidadTiempoPlural + ". ¿Confirmás?"
          : "Esto va a borrar la reserva cargada en este casillero. ¿Confirmás?");
      pedirConfirmacion(msg, ()=> borrarRango(dlgRango), "Sí, borrar", "No, volver");
      return;
    }

    // Calculamos el rango final: por cantidad de noches en la vista diaria, o por duración numérica en la semanal
    let nuevoRango = [];
    if(VISTAS[vistaActual].esDiario){
      let noches = parseInt((document.getElementById("txtNoches").textContent || "1").trim(), 10) || 1;
      if(noches < 1) noches = 1;
      if(noches > 30) noches = 30; // tope duro de seguridad: nunca más de 30 noches de una carga
      let finElegido = inicio + noches*2 - 1;
      if(finElegido > COLUMNAS.length-1) finElegido = COLUMNAS.length-1;
      for(let k=inicio; k<=finElegido; k++) nuevoRango.push(k);
    } else {
      let duracion = parseInt(inpDuracion.value, 10) || 1;
      const maxDuracion = COLUMNAS.length - inicio;
      if(duracion < 1) duracion = 1;
      if(duracion > maxDuracion) duracion = maxDuracion;
      for(let k=0; k<duracion; k++) nuevoRango.push(inicio+k);
    }

    function aplicarGuardado(){
      pushUndo();
      dlgRango.forEach(sIdx=>{
        if(!nuevoRango.includes(sIdx)) delete datos[key(dlgU,sIdx)];
      });
      nuevoRango.forEach(sIdx=>{
        datos[key(dlgU,sIdx)] = {estado:"confirmado", nombre:nombreCargado, nota:notaCargada, color:dlgColor};
      });
      guardarDatos(datos);
      refrescarFila(dlgU);
      dlg.close();
    }

    // Si el nuevo rango pisa semanas/días de OTRA reserva (nombre distinto), lo avisamos en el mismo mensaje
    const conflictos = nuevoRango.filter(sIdx=>{
      if(dlgRango.includes(sIdx)) return false; // ya era parte de este mismo bloque
      const d = datos[key(dlgU,sIdx)];
      return d && (d.nombre || d.nota) && d.nombre !== nombreCargado;
    });

    const habiaAlgoAntes = dlgRango.some(sIdx=>{
      const d = datos[key(dlgU,sIdx)];
      return d && (d.nombre || d.nota);
    });

    let msg, labelSi;
    const finElegidoReal = nuevoRango[nuevoRango.length-1];
    const cantidadNoches = esDiarioMsg ? Math.round((finElegidoReal - inicio) / 2) : null;
    const esNochesInusuales = esDiarioMsg && cantidadNoches !== null && cantidadNoches >= 10;
    const rangoFechasTexto = esDiarioMsg
      ? (esNochesInusuales
          ? " ⚠️ OJO: son " + cantidadNoches + " noches — del " + fechaLegible(COLUMNAS[inicio].inicio) + " al " + fechaLegible(COLUMNAS[finElegidoReal].inicio) + ". Si no era esa la fecha, tocá \"No, volver\" y revisá el campo Hasta."
          : " Del " + fechaLegible(COLUMNAS[inicio].inicio) + " al " + fechaLegible(COLUMNAS[finElegidoReal].inicio) + ".")
      : "";

    if(conflictos.length > 0){
      const nombresConflicto = [...new Set(conflictos.map(sIdx=> (datos[key(dlgU,sIdx)]||{}).nombre || "(sin nombre)"))].join(", ");
      msg = esDiarioMsg
        ? "Ojo: vas a pisar la reserva de \"" + nombresConflicto + "\" en este tramo." + rangoFechasTexto + " ¿Confirmás?"
        : "Ojo: vas a pisar la reserva de \"" + nombresConflicto + "\" en " + conflictos.length + " " + unidadTiempoPlural + ". ¿Confirmás?";
      labelSi = "Sí, pisar reserva";
    } else if(habiaAlgoAntes){
      msg = esDiarioMsg
        ? "¿Confirmás modificar esta reserva?" + rangoFechasTexto
        : (nuevoRango.length > 1
          ? "¿Confirmás modificar esta reserva en estas " + nuevoRango.length + " " + unidadTiempoPlural + "?"
          : "¿Confirmás modificar esta reserva?");
      labelSi = "Sí, modificar";
    } else {
      msg = esDiarioMsg
        ? "¿Confirmás cargar esta reserva?" + rangoFechasTexto
        : (nuevoRango.length > 1
          ? "¿Confirmás cargar esta reserva para " + nuevoRango.length + " " + unidadTiempoPlural + "?"
          : "¿Confirmás cargar esta reserva?");
      labelSi = "Sí, cargar";
    }

    pedirConfirmacion(msg, aplicarGuardado, labelSi, "No, volver");
  });

  document.getElementById("btnBorrar").addEventListener("click", ()=>{
    const esDiarioMsg = VISTAS[vistaActual].esDiario;
    const msg = esDiarioMsg
      ? "Esto va a borrar la reserva cargada en este tramo. ¿Confirmás?"
      : (dlgRango.length > 1

        : "Esto va a borrar la reserva cargada en este casillero. ¿Confirmás?");
    pedirConfirmacion(msg, ()=> borrarRango(dlgRango), "Sí, borrar", "No, volver");

  document.getElementById("btnCerrar").addEventListener("click", ()=> dlg.close());

  // ---- Avisos de ingreso (día antes del check-in) ----
  const NOTIF_KEY = "buenpuerto_2027_notif_ok";

  function hoyISO(){
    const d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }

  function sumarDias(fechaISO, dias){
    const d = new Date(fechaISO+"T00:00:00");
    d.setDate(d.getDate()+dias);
    return d;
  }

  function mismodia(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function ingresosDeManana(){
    const hoy = hoyISO();
    const resultado = [];

    if(VISTAS[vistaActual].esDiario){
      // Usamos los bloques ya agrupados (una reserva = un bloque), y nos fijamos si el
      // PRIMER día de ese bloque (el check-in real) es mañana — así no se duplica entre
      // la mitad de mañana/tarde ni se confunde con días intermedios de una estadía larga.
      UNIDADES.forEach((u, uIdx)=>{
        const grupos = agruparGenerico(datos, COLUMNAS, uIdx);
        grupos.forEach(g=>{
          if(!g.ocupado) return;
          const fechaInicio = COLUMNAS[g.inicio].inicio;
          const diaAntes = sumarDias(fechaInicio, -1);
          if(mismodia(hoy, diaAntes)){
            resultado.push({unidad:u.nombre, codigo:u.codigo, nombre:g.nombre || "(sin nombre cargado)"});
          }
        });
      });
      return resultado;
    }

    COLUMNAS.forEach((s, sIdx)=>{
      const diaAntes = sumarDias(s.inicio, -1);
      if(mismodia(hoy, diaAntes)){
        UNIDADES.forEach((u, uIdx)=>{
          const d = datos[key(uIdx,sIdx)];
          if(d && d.estado === "confirmado"){
            resultado.push({unidad:u.nombre, codigo:u.codigo, nombre:d.nombre || "(sin nombre cargado)", semana:s});
          }
        });
      }
    });
    return resultado;
  }

  function chequearAvisos(){
    const ingresos = ingresosDeManana();
    const box = document.getElementById("avisoBox");
    if(ingresos.length === 0){
      box.style.display = "none";
      return;
    }
    const lista = ingresos.map(i => `• ${i.unidad} (${i.codigo}) — ${i.nombre}`).join("<br>");
    box.innerHTML = "<strong>🔔 Ingresan mañana:</strong><br>" + lista;
    box.style.display = "block";

    if("Notification" in window && Notification.permission === "granted"){
      ingresos.forEach(i=>{
        new Notification("Buen Puerto — Ingreso mañana", {
          body: `${i.unidad} (${i.codigo}): ${i.nombre}`,
        });
      });
    }
  }

  const btnActivarAvisos = null;

  // ---- Header de semanas "congelado" con JS (más confiable que el sticky nativo) ----
  const scrollWrap = document.getElementById("scrollWrap");
  const mainTable = document.getElementById("mainTable");
  const fixedHead = document.getElementById("fixedHead");
  const fixedHeadInner = document.getElementById("fixedHeadInner");
  const theadOriginal = mainTable.querySelector("thead");

  function construirHeaderFijo(){
    fixedHeadInner.innerHTML = "";
    const cloneTable = document.createElement("table");
    cloneTable.style.width = mainTable.offsetWidth + "px";
    cloneTable.style.minWidth = mainTable.offsetWidth + "px";
    const colgroupOriginal = mainTable.querySelector("colgroup");
    if(colgroupOriginal) cloneTable.appendChild(colgroupOriginal.cloneNode(true));
    cloneTable.appendChild(theadOriginal.cloneNode(true));
    fixedHeadInner.appendChild(cloneTable);
  }

  function sincronizarHeaderFijo(){
    const rect = theadOriginal.getBoundingClientRect();
    if(rect.top <= 0){
      const wrapRect = scrollWrap.getBoundingClientRect();
      fixedHead.style.display = "block";
      fixedHead.style.left = wrapRect.left + "px";
      fixedHead.style.width = wrapRect.width + "px";
      fixedHeadInner.style.transform = "translateX(" + (-scrollWrap.scrollLeft) + "px)";
    } else {
      fixedHead.style.display = "none";
    }
  }

  construirHeaderFijo();
  sincronizarHeaderFijo();
  window.addEventListener("scroll", sincronizarHeaderFijo, {passive:true});
  scrollWrap.addEventListener("scroll", sincronizarHeaderFijo, {passive:true});
  window.addEventListener("resize", ()=>{ construirHeaderFijo(); sincronizarHeaderFijo(); ajustarAlturaCuadrada(); });

  // ---- Cambio de pestaña (Temporada / Septiembre 2026) ----
  function cambiarVista(nuevaVista){
    if(nuevaVista === vistaActual) return;
    vistaActual = nuevaVista;
    COLUMNAS = VISTAS[vistaActual].columnas;
    // Los datos de todas las pestañas ya se están escuchando en tiempo real desde el arranque;
    // si por algún motivo todavía no llegó el primer dato, usamos el inicial como puente.
    datos = cacheDatosPorVista[vistaActual] || DATOS_INICIALES_POR_VISTA[vistaActual] || {};

    // El deshacer es por pestaña: al cambiar de vista arrancamos su propio historial
    undoStack.length = 0;
    actualizarBotonDeshacer();

    document.querySelectorAll(".tab-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.vista === nuevaVista);
    });

    construirHeader();
    renderTodo();
    ajustarAlturaCuadrada();
    requestAnimationFrame(ajustarAlturaCuadrada);
    construirHeaderFijo();
    sincronizarHeaderFijo();
    chequearAvisos();
    scrollWrap.scrollLeft = 0;
  }

  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> cambiarVista(btn.dataset.vista));

  // ---- Toast simple (mensajes cortos temporales) ----
  let toastTimer = null;
  function mostrarToast(msg){
    const box = document.getElementById("toastBox");
    box.textContent = msg;
    box.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ box.style.display = "none"; }, 4000);

  function isoLocal(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  // ---- Buscador de inquilinos (busca en TODAS las pestañas, no solo la activa) ----
  function obtenerDatosDeVista(vistaKey){
    if(vistaKey === vistaActual) return datos;
    return cacheDatosPorVista[vistaKey] || DATOS_INICIALES_POR_VISTA[vistaKey] || {};
  }

  function formatColumnaDe(columnasVista, esDiarioVista, idx){
    const c = columnasVista[idx];
    if(esDiarioVista){
      const [y,m,d] = c.inicio.split("-");
      const mesAbrev = MESES_ABREV[parseInt(m,10)-1];
      return c.diaSemanaCompleto + " " + parseInt(d,10) + " " + mesAbrev + " " + y.slice(2);
    }
    return c.label + " (" + c.rango + ")";
  }

  function buscarInquilinos(query){
    const q = query.trim().toLowerCase();
    if(!q) return [];
    const resultados = [];
    Object.keys(VISTAS).forEach(vistaKey=>{
      const vista = VISTAS[vistaKey];
      const datosVista = obtenerDatosDeVista(vistaKey);
      UNIDADES.forEach((u, uIdx)=>{
        const grupos = agruparGenerico(datosVista, vista.columnas, uIdx);
        grupos.forEach(g=>{
          if(g.ocupado && g.nombre && g.nombre.toLowerCase().includes(q)){
            const rangoTexto = g.fin > g.inicio
              ? formatColumnaDe(vista.columnas, vista.esDiario, g.inicio) + "  →  " + formatColumnaDe(vista.columnas, vista.esDiario, g.fin)
              : formatColumnaDe(vista.columnas, vista.esDiario, g.inicio);
            resultados.push({
              vistaKey, vistaTitulo: vista.titulo,
              uIdx, unidadNombre: u.nombre, unidadCodigo: u.codigo,
              inicio: g.inicio, fin: g.fin, nombre: g.nombre, nota: g.nota, rangoTexto
            });
          }
        });
      });
    });
    return resultados;
  }

  function renderResultadosBuscar(resultados, query){
    const cont = document.getElementById("resultadosBuscar");
    cont.innerHTML = "";
    if(!query.trim()){
      cont.innerHTML = '<p style="font-size:12px;color:var(--muted);margin:6px 0;">Escribí un nombre para buscar.</p>';
      return;
    }
    if(resultados.length === 0){
      cont.innerHTML = '<p style="font-size:12px;color:var(--muted);margin:6px 0;">Sin resultados.</p>';
      return;
    }
    resultados.forEach(r=>{
      const row = document.createElement("div");
      row.style.cssText = "display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--border); border-radius:8px; padding:8px 10px;";
      const info = document.createElement("div");
      info.style.cssText = "font-size:12px; line-height:1.4; color:var(--text);";
      info.innerHTML = "<strong>"+r.nombre+"</strong><br>"+r.unidadNombre+" ("+r.unidadCodigo+") · "+r.vistaTitulo+"<br><span style='color:var(--muted);'>"+r.rangoTexto+"</span>";
      const btnIr = document.createElement("button");
      btnIr.textContent = "IR";
      btnIr.style.cssText = "background:var(--navy); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0;";
      btnIr.addEventListener("click", ()=>{
        dlgBuscar.close();
        irAResultado(r);
      });
      row.appendChild(info);
      row.appendChild(btnIr);
      cont.appendChild(row);
    });
  }

  function resaltarCelda(td){
    const slot = td.querySelector(".slot");
    td.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
    if(slot){
      const prevOutline = slot.style.outline;
      slot.style.outline = "3px solid #fff";
      slot.style.outlineOffset = "1px";
      setTimeout(()=>{ slot.style.outline = prevOutline; }, 1600);
    }
  }

  function irAResultado(r){
    const finIr = ()=>{
      requestAnimationFrame(()=>{
        const fila = document.querySelectorAll("#bodyTable tr")[r.uIdx];
        if(!fila) return;
        const celdas = fila.querySelectorAll("td.cell");
        const grupos = agruparSemanas(r.uIdx);
        for(let i=0; i<grupos.length; i++){
          if(grupos[i].inicio <= r.inicio && r.inicio <= grupos[i].fin){
            if(celdas[i]) resaltarCelda(celdas[i]);
            break;
          }
        }
      });
    };
    if(r.vistaKey !== vistaActual){
      cambiarVista(r.vistaKey);
      setTimeout(finIr, 60);
    } else {
      finIr();
    }
  }

  const dlgBuscar = document.getElementById("dlgBuscar");
  const inpBuscar = document.getElementById("inpBuscar");

  document.getElementById("btnBuscar").addEventListener("click", ()=>{
    inpBuscar.value = "";
    renderResultadosBuscar([], "");
    dlgBuscar.showModal();
    setTimeout(()=> inpBuscar.focus(), 50);
  });
  document.getElementById("btnCerrarBuscar").addEventListener("click", ()=> dlgBuscar.close());
  inpBuscar.addEventListener("input", ()=>{
    renderResultadosBuscar(buscarInquilinos(inpBuscar.value), inpBuscar.value);
  });

  // ---- Botón "Hoy": va directo a la fecha de hoy, sin importar en qué pestaña estés ----
  function columnaContieneFecha(col, esDiarioVista, fechaISO){
    if(esDiarioVista) return col.inicio === fechaISO;
    const finSemana = isoLocal(sumarDias(col.inicio, 6));
    return fechaISO >= col.inicio && fechaISO <= finSemana;
  }

  function irAHoy(){
    const hoyStr = isoLocal(new Date());
    let vistaEncontrada = null;
    let indiceEncontrado = null;

    for(const vistaKey of Object.keys(VISTAS)){
      const vista = VISTAS[vistaKey];
      let ultimoMatch = null;
      for(let i=0; i<vista.columnas.length; i++){
        if(columnaContieneFecha(vista.columnas[i], vista.esDiario, hoyStr)){
          ultimoMatch = i;
        }
      }
      if(ultimoMatch !== null){
        vistaEncontrada = vistaKey;
        indiceEncontrado = ultimoMatch;
        break;
      }
    }

    if(!vistaEncontrada){
      mostrarToast("Hoy no está dentro de ninguno de los calendarios cargados.");
      return;
    }

    const irYResaltar = ()=>{
      requestAnimationFrame(()=>{
        const fila = document.querySelectorAll("#bodyTable tr")[0];
        if(!fila) return;
        const celdas = fila.querySelectorAll("td.cell");
        const grupos = agruparSemanas(0);
        for(let i=0; i<grupos.length; i++){
          if(grupos[i].inicio <= indiceEncontrado && indiceEncontrado <= grupos[i].fin){
            if(celdas[i]) resaltarCelda(celdas[i]);
            break;
          }
        }
      });
    };

    if(vistaEncontrada !== vistaActual){
      cambiarVista(vistaEncontrada);
      setTimeout(irYResaltar, 60);
    } else {
      irYResaltar();
    }
  }

  document.getElementById("btnHoy").addEventListener("click", irAHoy);

  // ---- Exportar a Google Calendar (.ics) ----
  function pad2(n){ return String(n).padStart(2, "0"); }

  function fechaICSallDay(fechaISO){
    // fechaISO viene como "YYYY-MM-DD"
    return fechaISO.replace(/-/g, "");
  }

  function fechaICSconHora(fechaISO, hora, minuto){
    const [y,m,d] = fechaISO.split("-");
    return y + m + d + "T" + pad2(hora) + pad2(minuto) + "00";
  }

  function escaparICS(txt){
    return String(txt).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }

  function fechaLegible(iso){
    const [y,m,d] = iso.split("-");
    return d + "/" + m + "/" + y;
  }

  function generarEventosDeVista(vistaKey){
    const vista = VISTAS[vistaKey];
    const datosVista = obtenerDatosDeVista(vistaKey);
    const eventos = [];

    UNIDADES.forEach((u, uIdx)=>{
      const grupos = agruparGenerico(datosVista, vista.columnas, uIdx);
      grupos.forEach(g=>{
        if(!g.ocupado) return;
        const colIni = vista.columnas[g.inicio];
        const colFin = vista.columnas[g.fin];
        let dtStart, dtEnd, allDay, descripcion;

        if(vista.esDiario){
          // Un solo evento el día de ingreso (14:00), de 1 hora — el rango completo va en la descripción
          dtStart = fechaICSconHora(colIni.inicio, 14, 0);
          dtEnd = fechaICSconHora(colIni.inicio, 15, 0);
          allDay = false;
          descripcion = "Estadía del " + fechaLegible(colIni.inicio) + " al " + fechaLegible(colFin.inicio) + " (checkout 10:00 hs)";
        } else {
          // Un solo día (all-day) en el inicio de la primer semana — el rango completo va en la descripción
          const finRango = isoLocal(sumarDias(colFin.inicio, 6));
          dtStart = fechaICSallDay(colIni.inicio);
          dtEnd = fechaICSallDay(isoLocal(sumarDias(colIni.inicio, 1)));
          allDay = true;
          descripcion = "Estadía del " + fechaLegible(colIni.inicio) + " al " + fechaLegible(finRango);
        }

        if(g.nota) descripcion += " — " + g.nota;

        eventos.push({
          uid: "bp-" + vistaKey + "-" + uIdx + "-" + g.inicio + "-" + g.fin + "@buenpuerto",
          titulo: "Ingreso: " + g.nombre + " — " + u.nombre + " (" + u.codigo + ")",
          descripcion: escaparICS(descripcion),
          dtStart, dtEnd, allDay
        });
      });
    });

    return eventos;
  }

  function generarICS(){
    const ahora = new Date();
    const dtStamp = ahora.getUTCFullYear()+pad2(ahora.getUTCMonth()+1)+pad2(ahora.getUTCDate())+"T"+pad2(ahora.getUTCHours())+pad2(ahora.getUTCMinutes())+pad2(ahora.getUTCSeconds())+"Z";

    let eventos = [];
    Object.keys(VISTAS).forEach(vistaKey=>{
      eventos = eventos.concat(generarEventosDeVista(vistaKey));
    });

    const lineas = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//Condominio Buen Puerto//Calendario//ES",
      "CALSCALE:GREGORIAN"
    ];

    eventos.forEach(ev=>{
      lineas.push("BEGIN:VEVENT");
      lineas.push("UID:" + ev.uid);
      lineas.push("DTSTAMP:" + dtStamp);
      if(ev.allDay){
        lineas.push("DTSTART;VALUE=DATE:" + ev.dtStart);
        lineas.push("DTEND;VALUE=DATE:" + ev.dtEnd);
      } else {
        lineas.push("DTSTART:" + ev.dtStart);
        lineas.push("DTEND:" + ev.dtEnd);
      }
      lineas.push("SUMMARY:" + escaparICS(ev.titulo));
      if(ev.descripcion) lineas.push("DESCRIPTION:" + ev.descripcion);
      // Recordatorio: 1 día antes
      lineas.push("BEGIN:VALARM");
      lineas.push("ACTION:DISPLAY");
      lineas.push("DESCRIPTION:Recordatorio ingreso — " + escaparICS(ev.titulo));
      lineas.push("TRIGGER:-P1D");
      lineas.push("END:VALARM");
      lineas.push("END:VEVENT");
    });

    lineas.push("END:VCALENDAR");
    return lineas.join("\r\n");
  }

  document.getElementById("btnExportarCal").addEventListener("click", ()=>{
    const contenido = generarICS();
    const blob = new Blob([contenido], {type: "text/calendar;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "buen-puerto-reservas.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    mostrarToast("Listo — se descargó el archivo. Importalo en Google Calendar (calendar.google.com → Ajustes → Importar).");
  });

  // Ya se armó la pantalla por primera vez: ahora sí activamos la escucha en vivo
  // de las 5 pestañas (así el buscador, "Hoy" y la exportación siempre tienen datos frescos,
  // y cualquier cambio hecho desde OTRO dispositivo se refleja acá solo, sin recargar la página).
  window.__appIniciada = true;
  Object.keys(VISTAS).forEach(v=> iniciarListenerVista(v));
</script>
