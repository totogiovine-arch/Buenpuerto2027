<script type="module">
/* ============ Luz a propietarios — Buen Puerto ============
   Lee las reservas del calendario (solo lectura) y guarda sus datos propios
   en el documento "luz_propietarios" de la misma base. No toca nada del calendario. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCEYSLt4NDCLZ7xpUR3h8tdVBSjDiZ0lXE",
  authDomain: "calendario-app-bp.firebaseapp.com",
  projectId: "calendario-app-bp",
  storageBucket: "calendario-app-bp.firebasestorage.app",
  messagingSenderId: "786928589358",
  appId: "1:786928589358:web:4943d9572bedd483abddbf"
};
const COL = "calendario";
const DOC_LUZ = "luz_propietarios";
const DOCS_MES = [["sep2026",2026,9],["oct2026",2026,10],["nov2026",2026,11],["dic2026",2026,12],["mar2027",2027,3],["abr2027",2027,4]];
const SEM_INICIO = Date.UTC(2026,11,19);   // SEM 0 = 19 Dic 2026, 7 noches por semana
const DIA = 86400000;
const UNIDADES = [
 "Puerto Nuevo","Puerto Deseado","Puerto de la Boca","Puerto Blest","Puerto Madero","Puerto Pañuelo",
 "Caleta Olivia","Puerto Pirámides","Puerto de Frutos","Puerto San Julián","Puerto San Carlos",
 "Puerto Esmeralda","Puerto Piray","Puerto Epuyén","Puerto Jaramillo","Puerto Canoa","Puerto Madryn","Puerto Iguazú"
].map((n,i)=>({i,nombre:n,codigo:"BP "+(i+1)}));
const COMPARTE = {1:"Medidor compartido (Pirámides 1)",6:"Medidor compartido (Pirámides 2)",7:"Medidor compartido (Pirámides 1 y 2)"};
const PROP_DEFECTO = u => ([12,13,14,15].includes(u) ? "Karin" : u===8 ? "Miguel" : "Familia Pozzi");
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const LISTA_MESES = ["2026-09","2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04"];
const nombreMes = ym => { const [y,m]=ym.split("-"); return MESES[+m-1]+" "+y; };

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$ "+Math.round(n).toLocaleString("es-AR");
const iso = ms => new Date(ms).toISOString().slice(0,10);
const fcorta = f => f.slice(8,10)+"/"+f.slice(5,7);
const hoyISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

const state = { datos:{}, cargado:{}, errorLectura:false, luz:{unidades:{},pagos:{},exentos:{},valorSemana:0},verReservas:false, luzCargado:false, errorLuz:false,
                periodo:"todo", tab:"porunidad", abiertas:{} };
let fb = null;

/* ---------- conexión ---------- */
async function conectar(){
  if(window.__TEST_FB){ fb = window.__TEST_FB; await fb.ready; return; }
  const V="11.0.2";
  const [A,F,Au] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG, "luz");
  const db = F.getFirestore(app); const auth = Au.getAuth(app);
  await new Promise((res,rej)=>{ Au.onAuthStateChanged(auth,u=>{ if(u) res(u); }); Au.signInAnonymously(auth).catch(rej); });
  fb = { db, doc:F.doc, onSnapshot:F.onSnapshot, setDoc:F.setDoc, updateDoc:F.updateDoc, deleteField:F.deleteField };
}

function escuchar(){
  const claves = [...DOCS_MES.map(d=>d[0]), "temporada"];
  claves.forEach(k=>{
    fb.onSnapshot(fb.doc(fb.db,COL,k), snap=>{
      state.datos[k] = snap.exists() ? (snap.data().datos||{}) : {};
      state.cargado[k] = true; render();
    }, ()=>{ state.errorLectura = true; render(); });
  });
  fb.onSnapshot(fb.doc(fb.db,COL,DOC_LUZ), snap=>{
    const d = snap.exists() ? snap.data() : {};
    state.luz = { unidades:d.unidades||{}, pagos:d.pagos||{}, exentos:d.exentos||{}, valorSemana:Number(d.valorSemana)||0 };
    state.luzCargado = true; render();
    if($("#dlgDetalle").open) pintarDetalle(state.detalleU);
  }, ()=>{ state.errorLuz = true; render(); });
}

/* ---------- cálculo de noches ---------- */
function calcularNoches(){
  const out = [];
  const poner = (u,ms,c)=>{
    if(!c || !c.nombre) return;
    const color = c.color || "rojo";
    if(color==="violeta") return;              // bloqueos de administración: no son alquiler
    out.push({u, fecha:iso(ms), nombre:String(c.nombre).trim(), lapiz: color==="amarillo"});
  };
  for(const [key,y,m] of DOCS_MES){
    const d = state.datos[key]||{};
    for(const k in d){
      const [u,s] = k.split("_").map(Number);
      if(u>17 || s%2!==1) continue;            // solo turno PM = noche dormida
      poner(u, Date.UTC(y,m-1,(s-1)/2+1), d[k]);
    }
  }
  const t = state.datos.temporada||{};
  for(const k in t){
    const [u,s] = k.split("_").map(Number);
    if(u>17) continue;
    for(let i=0;i<7;i++) poner(u, SEM_INICIO+(s*7+i)*DIA, t[k]);
  }
  return out;
}

/* Invitados del propietario: días que NO se pagan (se marcan en el detalle de cada unidad) */
function exentosList(){ return Object.entries(state.luz.exentos||{}).map(([id,e])=>({id,...e})); }
function esExento(u,fecha){ return exentosList().some(e=>e.u===u && fecha>=e.desde && fecha<=e.hasta); }

function calcular(){
  const noches = calcularNoches().filter(n=> state.periodo==="todo" || n.fecha.slice(0,7)===state.periodo)
    .map(n=>({...n, exento:esExento(n.u,n.fecha)}));
  const porU = UNIDADES.map(un=>{
    const cfg = state.luz.unidades[un.i]||{};
    const valor = state.luz.valorSemana || Number(cfg.valor)||0;
    const mias = noches.filter(n=>n.u===un.i).sort((a,b)=>a.fecha<b.fecha?-1:1);
    const conf = mias.filter(n=>!n.lapiz && !n.exento), inv = mias.filter(n=>!n.lapiz && n.exento), lap = mias.filter(n=>n.lapiz);
    const devengado = Math.round(conf.length*valor/7);
    const pagos = Object.entries(state.luz.pagos).map(([id,p])=>({id,...p}))
      .filter(p=>p.u===un.i && (state.periodo==="todo" || p.mes===state.periodo));
    const pagado = pagos.reduce((a,p)=>a+(Number(p.monto)||0),0);
    return { un, valor, prop:(cfg.propietario||"").trim()||PROP_DEFECTO(un.i), conf, inv, lap, devengado, pagado, pend:devengado-pagado, estancias:agrupar(mias,valor) };
  });
  return porU;
}
function agrupar(mias,valor){
  const res=[]; let cur=null;
  for(const n of mias){
    const sig = iso(Date.parse(n.fecha+"T00:00:00Z")+DIA);
    if(cur && cur.nombre===n.nombre && cur.lapiz===n.lapiz && cur.exento===n.exento && cur.ultima===iso(Date.parse(n.fecha+"T00:00:00Z")-DIA)){ cur.ultima=n.fecha; cur.fin=sig; cur.noches++; }
    else { if(cur) res.push(cur); cur={nombre:n.nombre,lapiz:n.lapiz,exento:n.exento,ini:n.fecha,ultima:n.fecha,fin:sig,noches:1}; }
  }
  if(cur) res.push(cur);
  res.forEach(e=>e.monto=e.exento?0:Math.round(e.noches*valor/7));
  return res;
}

function kpis(filas){
  const dev = filas.reduce((a,f)=>a+f.devengado,0), pag = filas.reduce((a,f)=>a+f.pagado,0);
  return `<div class="cards">
    <div class="kpi"><span>A pagar</span><b class="num">${money(dev)}</b></div>
    <div class="kpi ok"><span>Pagado</span><b class="num">${money(pag)}</b></div>
    <div class="kpi pend"><span>Pendiente</span><b class="num">${money(dev-pag)}</b></div></div>`;
}

function filaDetalle(u){ return calcular().find(x=>x.un.i===u); }
function estanciasCompletas(u,valor){
  const todas = calcularNoches().filter(n=>n.u===u).sort((a,b)=>a.fecha<b.fecha?-1:1);
  const res=[]; let cur=null;
  for(const n of todas){
    const prev = iso(Date.parse(n.fecha+"T00:00:00Z")-DIA);
    if(cur && cur.nombre===n.nombre && cur.lapiz===n.lapiz && cur.ultima===prev){ cur.ultima=n.fecha; cur.dias.push(n.fecha); }
    else { if(cur) res.push(cur); cur={nombre:n.nombre,lapiz:n.lapiz,ini:n.fecha,ultima:n.fecha,dias:[n.fecha]}; }
  }
  if(cur) res.push(cur);
  return res.map(e=>{
    const enP = e.dias.filter(f=>state.periodo==="todo"||f.slice(0,7)===state.periodo);
    const cuentan = enP.filter(f=>!esExento(u,f));
    return {...e, fin:iso(Date.parse(e.ultima+"T00:00:00Z")+DIA), diasP:enP.length, exento:e.dias.every(f=>esExento(u,f)),
            diasCuentan: e.lapiz?0:cuentan.length, monto: e.lapiz?0:Math.round(cuentan.length*valor/7)};
  }).filter(e=>e.diasP>0);
}

  const pg = pagos.length ? pagos.map(p=>`<tr><td>${p.fecha.split("-").reverse().join("/")}${p.mes?" · "+nombreMes(p.mes):""}${p.nota?"<br><small>"+esc(p.nota)+"</small>":""}</td><td class="r">$ ${num(p.monto)}</td></tr>`).join("") : '<tr><td><small>Todavía no hay pagos</small></td><td></td></tr>';
  const inv = f.inv.length;
  $("#dtCuerpo").innerHTML = `
    <table class="dt">

      <tr><td>Precio por semana</td><td class="r">${f.valor?"$ "+num(f.valor):"sin cargar"}</td></tr>
      <tr class="t"><td>Total a pagar</td><td class="r">$ ${num(f.devengado)}</td></tr>

    <div class="dsec">Pagos registrados</div><table class="dt">${pg}</table>`;
}

  if(!puedeEscribir()) return false;
  const id = "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{ await fb.setDoc(fb.doc(fb.db,COL,DOC_LUZ), {pagos:{[id]:{...p,creado:new Date().toISOString()}}, actualizado:new Date().toISOString()}, {merge:true}); return true; }
  catch(e){ console.error(e); toast("No se pudo guardar el pago"); return false; }
}
async function borrarPago(id){
  if(!puedeEscribir()) return;
  try{ await fb.updateDoc(fb.doc(fb.db,COL,DOC_LUZ), {["pagos."+id]: fb.deleteField(), actualizado:new Date().toISOString()}); toast("Pago borrado"); }
  catch(e){ console.error(e); toast("No se pudo borrar"); }
}

/* ---------- diálogos ---------- */
function abrirPago(u){
  const filas = calcular();
  $("#pgUnidad").innerHTML = filas.map(f=>`<option value="${f.un.i}">${f.un.codigo} · ${esc(f.un.nombre)} (${esc(f.prop)})</option>`).join("");
  $("#pgMes").innerHTML = '<option value="">General (sin mes)</option>'+LISTA_MESES.map(m=>`<option value="${m}">${nombreMes(m)}</option>`).join("");
  $("#pgFecha").value = hoyISO();
  $("#pgNota").value = "";
  $("#pgMes").value = state.periodo==="todo" ? "" : state.periodo;
  if(u!=null) $("#pgUnidad").value = String(u);
  const f = filas.find(x=>x.un.i===+$("#pgUnidad").value);
  $("#pgMonto").value = f && f.pend>0 ? f.pend : "";
  $("#dlgPago").showModal();
}
$("#pgUnidad").addEventListener("change",()=>{
  const f = calcular().find(x=>x.un.i===+$("#pgUnidad").value); $("#pgMonto").value = f && f.pend>0 ? f.pend : "";
});
$("#pgGuardar").addEventListener("click", async ()=>{
  const monto = Math.round(Number($("#pgMonto").value));
  if(!(monto>0)){ toast("Poné un monto mayor a cero"); return; }
  const fecha = $("#pgFecha").value || hoyISO();
  const ok = await guardarPago({u:+$("#pgUnidad").value, monto, fecha, mes:$("#pgMes").value, nota:$("#pgNota").value.trim()});
  if(ok){ $("#dlgPago").close(); toast("Pago registrado"); }
});
let idBorrar = null;
$("#bdOk").addEventListener("click", async ()=>{ const id=idBorrar; $("#dlgBorrar").close(); if(id) await borrarPago(id); });

function resumenDatos(){
  const filas = calcular().filter(f=>f.devengado||f.pagado||f.conf.length||f.inv.length);
  const grupos = {}; filas.forEach(f=>(grupos[f.prop] ||= []).push(f));
  return Object.keys(grupos).sort((a,b)=>a.localeCompare(b,"es")).map(p=>{
    const g=grupos[p];
    return {prop:p, filas:g, dev:g.reduce((a,f)=>a+f.devengado,0), pag:g.reduce((a,f)=>a+f.pagado,0), dias:g.reduce((a,f)=>a+f.conf.length,0)};
  });
}
function perResumen(){ return state.periodo==="todo" ? "Temporada 2026/27" : nombreMes(state.periodo); }
function textoPropietario(o){
  const l=[`*${o.prop}*`,`Luz por consumo de inquilinos · ${perResumen()}`,""];
  o.filas.forEach(f=>{
    l.push(`• ${f.un.codigo} ${f.un.nombre}: ${f.conf.length} día${f.conf.length===1?"":"s"} (${sem1(f.conf.length/7)} sem) → ${money(f.devengado)}${f.inv.length?` · ${f.inv.length} de invitados, no se pagan`:""}`);
  });
  l.push("",`Total a pagar: ${money(o.dev)}`);
  if(o.pag) l.push(`Ya pagado: ${money(o.pag)}`);
  l.push(`*Saldo: ${money(o.dev-o.pag)}*`);
  return l.join("\n");
}
function textoResumen(){ return resumenDatos().map(textoPropietario).join("\n\n———\n\n") || "Sin movimientos en el período."; }
function pintarResumen(){
  const datos=resumenDatos();
  if(!datos.length){ $("#rsChips").innerHTML=""; $("#rsCard").innerHTML='<div class="empty" style="color:#6b7690">Sin movimientos en el período.</div>'; $("#rsTexto").value=""; return; }
  if(state.rsSel==null || (state.rsSel!=="todos" && !datos.some(d=>d.prop===state.rsSel))) state.rsSel=datos[0].prop;
  $("#rsChips").innerHTML = datos.map(d=>`<button data-p="${esc(d.prop)}" class="${state.rsSel===d.prop?"on":""}">${esc(d.prop)}</button>`).join("")
    + (datos.length>1?`<button data-p="todos" class="${state.rsSel==="todos"?"on":""}">Todos</button>`:"");
  const sel = state.rsSel==="todos" ? datos : datos.filter(d=>d.prop===state.rsSel);
  $("#rsCard").innerHTML = sel.map(o=>`<div class="rc" style="margin-bottom:10px">
    <div class="top"><b>${esc(o.prop)}</b><span>Luz por consumo de inquilinos · ${perResumen()}</span></div>
    <div class="big"><div><small>${o.dev-o.pag<0?"Saldo a favor":"Saldo a pagar"}</small><strong>${money(Math.abs(o.dev-o.pag))}</strong></div><em>${o.dias} días alquilados<br>${sem1(o.dias/7)} semanas</em></div>
    ${o.filas.map(f=>`<div class="row"><div>${f.un.codigo} · ${esc(corto(f.un.nombre))}<small>${f.conf.length} día${f.conf.length===1?"":"s"} · ${sem1(f.conf.length/7)} sem${f.inv.length?` · ${f.inv.length} invitado${f.inv.length>1?"s":""} (no se paga)`:""}</small></div><div class="m">${money(f.devengado)}</div></div>`).join("")}
    <div class="tot"><div>Total<b>${money(o.dev)}</b></div><div>Pagado<b>${money(o.pag)}</b></div><div class="sd">Saldo<b>${money(o.dev-o.pag)}</b></div></div>
  </div>`).join("");
  $("#rsTexto").value = state.rsSel==="todos" ? datos.map(textoPropietario).join("\n\n———\n\n") : textoPropietario(sel[0]);
}

/* ---------- eventos ---------- */
$("#periodo").addEventListener("change",e=>{ state.periodo=e.target.value; render(); });
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b){ state.tab=b.dataset.tab; render(); window.scrollTo(0,0); } });
$("#btnPago").addEventListener("click",()=>abrirPago(null));
$("#btnResumen").addEventListener("click",()=>{ pintarResumen(); $("#dlgResumen").showModal(); });
$("#rsChips").addEventListener("click",e=>{ const b=e.target.closest("button[data-p]"); if(b){ state.rsSel=b.dataset.p; pintarResumen(); } });
$("#dtCuerpo").addEventListener("change",e=>{
  const c = e.target.closest("input[data-ini]"); if(!c) return;
  marcarInvitado(state.detalleU, c.dataset.ini, c.dataset.ult, c.dataset.nom, c.checked);
});
$("#dtCopiar").addEventListener("click", async ()=>{
  const t = textoDetalle(state.detalleU);
  try{ await navigator.clipboard.writeText(t); toast("Copiado"); }catch{ toast("No se pudo copiar"); }
});
$("#rsCopiar").addEventListener("click", async ()=>{
  const t = $("#rsTexto"); t.hidden=false; t.select(); t.hidden=true;
  try{ await navigator.clipboard.writeText(t.value); toast("Copiado"); }catch{ document.execCommand("copy"); toast("Copiado"); }
});
document.querySelectorAll("dialog").forEach(d=>d.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) d.close(); }));
$("#main").addEventListener("click",e=>{
  const tr = e.target.closest("tr[data-det]"); if(tr){ abrirDetalle(+tr.dataset.det); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="pagar") abrirPago(+b.dataset.u);
  else if(a==="det"){ const u=+b.dataset.u; state.abiertas[u]=!state.abiertas[u]; b.closest(".u").classList.toggle("open",!!state.abiertas[u]); }
  else if(a==="borrar"){ idBorrar=b.dataset.id; const p=state.luz.pagos[idBorrar]||{}; $("#bdDet").textContent=(UNIDADES[p.u]?UNIDADES[p.u].codigo+" · ":"")+money(p.monto||0); $("#dlgBorrar").showModal(); }
});
$("#main").addEventListener("change",e=>{
  if(e.target.id==="valorSemana"){ guardarValorSemana(Math.max(0,Math.round(Number(e.target.value)||0))); return; }
  if(e.target.id==="swReservas"){ state.verReservas=e.target.checked; render(); return; }
  const i = e.target.closest("input[data-campo]"); if(!i) return;
  const u=+i.dataset.u, campo=i.dataset.campo;
  guardarUnidad(u,campo, campo==="valor" ? Math.max(0,Math.round(Number(i.value)||0)) : i.value.trim());
});
let tt; function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1800); }

$("#ver").textContent = "v "+document.querySelector('meta[name="bp-version"]').content;
window.__luz = { calcular, state };    // para pruebas
conectar().then(escuchar).catch(err=>{ console.error(err); state.errorLuz=true; state.errorLectura=true; render(); });
</script>
<script>
/* Actualización automática: si hay una versión nueva publicada, se recarga sola (como el calendario) */
(function(){
  var meta=document.querySelector('meta[name="bp-version"]'), actual=meta?meta.content:'', chequeando=false, ultimo=0;
  function chequear(){
    var ahora=Date.now();
    if(chequeando||!actual||ahora-ultimo<60000||location.protocol.indexOf('http')!==0) return;
    chequeando=true; ultimo=ahora;
    fetch(location.pathname+'?chk='+ahora,{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(html){
      var m=html.match(/<meta name="bp-version" content="([^"]+)"/), nueva=m&&m[1];
      if(!nueva||nueva<=actual) return;
      var clave='luz-recarga-'+nueva;
      try{ if(sessionStorage.getItem(clave)) return; sessionStorage.setItem(clave,'1'); }catch(e){}
      if(document.querySelector('dialog[open]')){ ultimo=0; return; }
      var t=document.getElementById('toast'); if(t){ t.textContent='Hay una versión nueva. Actualizando…'; t.classList.add('show'); }
      setTimeout(function(){ location.replace(location.pathname+'?v='+nueva); },800);
    }).catch(function(){}).then(function(){ chequeando=false; });
  }
  window.addEventListener('load',function(){ setTimeout(chequear,1500); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') chequear(); });
  window.addEventListener('pageshow',function(e){ if(e.persisted) chequear(); });
})();
</script>
